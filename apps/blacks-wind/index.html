<script>
'use strict';
// ============================================================================
// OVER BLACKS — v0
// A 3D incompressible flow solve (WebGPU compute) over the real USGS lidar
// of the Torrey Pines gliderport (analytic stand-in if data/terrain.js is
// missing). Onshore wind enters from the west, has nowhere to go but up.
// A little glider tries to fly his figure; the wind edits it.
// ============================================================================

// ------------------------------------------------------------ configuration
const TERRAIN = window.BLACKS_TERRAIN || null;
const COAST = window.BLACKS_COAST || null;    // coarse surround DEM, scenery only
const TREES = window.BLACKS_TREES || null;    // real lidar canopy: x,y,zg,h,r per tree
const STRUCT = window.BLACKS_STRUCTURES || null;  // real OSM buildings/parking/roads/trails
const TINY = new URLSearchParams(location.search).has('tiny');  // headless smoke tests

const NX = TINY ? 76 : 152, NY = TINY ? 64 : 128, NZ = TINY ? 20 : 40;
const DX = TERRAIN ? TERRAIN.extentX : 2400;      // meters east-west
const DXM = DX / NX;                              // cubic cell size
const DY = NY * DXM, DZ = NZ * DXM;               // ≈2021 × ≈632 m at full res
const HX = TERRAIN ? TERRAIN.width : 304;         // heightfield resolution
const HY = TERRAIN ? TERRAIN.height : 256;
const NP = TINY ? 8192 : 65536;                   // haze wisps (fewer, larger, softer)
const NS = TINY ? 512 : 4096;                     // summonable streaklets
const JACOBI = TINY ? 8 : 18;
const TRAIL_N = 256;
const NG = 4;                                     // gliders up (Blacks usually has a few)
// gliderport in local meters (from lidar metadata; fallback ≈ center of cliff)
const GPORT = TERRAIN ? TERRAIN.gliderportXY : [DX * 0.42, DY * 0.49];

const $ = id => document.getElementById(id);

// ------------------------------------------------------------ terrain
function decodeF32(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}
function makeHeightfield() {
  return TERRAIN ? decodeF32(TERRAIN.b64) : makeAnalytic();  // south-first rows, meters
}
// Analytic stand-in: beach at ~2 m, sharp west-facing cliff to a ~105 m mesa.
function makeAnalytic() {
  const h = new Float32Array(HX * HY);
  const rand2 = (x, y) => {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };
  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return rand2(xi, yi) * (1 - u) * (1 - v) + rand2(xi + 1, yi) * u * (1 - v)
         + rand2(xi, yi + 1) * (1 - u) * v + rand2(xi + 1, yi + 1) * u * v;
  };
  const fbm = (x, y) => noise(x, y) * 0.5 + noise(x * 2.1, y * 2.1) * 0.25 + noise(x * 4.3, y * 4.3) * 0.125;

  for (let j = 0; j < HY; j++) {
    for (let i = 0; i < HX; i++) {
      const x = i / HX, y = j / HY;             // 0..1 across domain
      // cliff edge line wanders in y; ocean occupies the west ~35%
      const edge = 0.40 + 0.05 * Math.sin(y * 5.2) + 0.04 * (fbm(3 + y * 6, 7.7) - 0.5);
      const t = (x - edge) / 0.055;             // cliff width ~130 m
      let elev = 2 + 103 * smooth01(t);
      // mesa relief + canyon notch to the north (Blacks canyon-ish)
      if (x > edge) {
        elev += 14 * (fbm(x * 9, y * 9) - 0.5);
        const cy = (y - 0.78), cx = (x - edge - 0.10);
        const canyon = Math.exp(-(cy * cy) / 0.004) * Math.exp(-(cx * cx) / 0.01);
        elev -= 55 * canyon * smooth01((x - edge) / 0.05);
      }
      // ocean west of the beach
      const beach = 0.33 + 0.015 * Math.sin(y * 8.0);
      if (x < beach) elev = 0;
      else if (x < edge) elev = 2 + 3 * (x - beach) / (edge - beach);
      h[j * HX + i] = Math.max(elev, 0);
    }
  }
  return h;
}
function smooth01(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// solid mask at sim resolution from the heightfield
function makeSolid(height) {
  const s = new Uint32Array(NX * NY * NZ);
  for (let k = 0; k < NZ; k++) {
    const z = (k + 0.5) * DXM;
    for (let j = 0; j < NY; j++) {
      const hy = Math.min(HY - 1, Math.floor((j + 0.5) / NY * HY));
      for (let i = 0; i < NX; i++) {
        const hx = Math.min(HX - 1, Math.floor((i + 0.5) / NX * HX));
        if (z < height[hy * HX + hx]) s[i + NX * (j + NY * k)] = 1;
      }
    }
  }
  return s;
}

// ------------------------------------------------------------ structures geometry
// ear-clipping triangulation of a simple polygon (handles the non-convex OSM
// footprints). input/returns work in polygon-vertex indices. CCW assumed.
function polyArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a * 0.5;
}
function pointInTri(p, a, b, c) {
  const d1 = (p.x - b.x) * (a.y - b.y) - (a.x - b.x) * (p.y - b.y);
  const d2 = (p.x - c.x) * (b.y - c.y) - (b.x - c.x) * (p.y - c.y);
  const d3 = (p.x - a.x) * (c.y - a.y) - (c.x - a.x) * (p.y - a.y);
  const neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(neg && pos);
}
function earClip(poly) {                       // poly: [{x,y}] CCW; -> [[i,j,k], ...]
  const n = poly.length;
  if (n < 3) return [];
  const idx = [...Array(n).keys()];
  const tris = [];
  let guard = 0;
  while (idx.length > 3 && guard++ < n + 6) {
    let clipped = false;
    for (let i = 0; i < idx.length; i++) {
      const L = idx.length;
      const i0 = idx[(i + L - 1) % L], i1 = idx[i], i2 = idx[(i + 1) % L];
      const a = poly[i0], b = poly[i1], c = poly[i2];
      const cross = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
      if (cross <= 0) continue;                // reflex or collinear (CCW)
      let ok = true;
      for (const j of idx) {
        if (j === i0 || j === i1 || j === i2) continue;
        if (pointInTri(poly[j], a, b, c)) { ok = false; break; }
      }
      if (!ok) continue;
      tris.push([i0, i1, i2]);
      idx.splice(i, 1);
      clipped = true;
      guard = 0;
      break;
    }
    if (!clipped) break;                        // degenerate: bail (defensive)
  }
  if (idx.length === 3) tris.push([idx[0], idx[1], idx[2]]);
  return tris;
}
function toPoly(verts) {                         // flat [x,y,...] -> CCW [{x,y}], deduped
  const n = verts.length / 2;
  const poly = [];
  for (let i = 0; i < n; i++) {
    const x = verts[i * 2], y = verts[i * 2 + 1];
    const last = poly[poly.length - 1];
    if (last && Math.abs(last.x - x) < 1e-4 && Math.abs(last.y - y) < 1e-4) continue;
    poly.push({ x, y });
  }
  if (poly.length > 1) {                         // drop closing dup
    const f = poly[0], l = poly[poly.length - 1];
    if (Math.abs(f.x - l.x) < 1e-4 && Math.abs(f.y - l.y) < 1e-4) poly.pop();
  }
  if (polyArea(poly) < 0) poly.reverse();        // force CCW
  return poly;
}

// buildings -> extruded prisms; returns Float32Array, stride 8 (pos3, nrm3, hash, kind)
function buildBuildings(list, hAtM) {
  const V = [];
  const fr = x => x - Math.floor(x);
  // find the gliderport shop: nearest ~350 m^2 footprint to (1008,1053)
  let shopIdx = -1, shopBest = 1e9;
  for (let bi = 0; bi < list.length; bi++) {
    const b = list[bi];
    const poly = toPoly(b.verts);
    if (poly.length < 3) continue;
    const area = Math.abs(polyArea(poly));
    if (area < 180 || area > 600) continue;
    let cx = 0, cy = 0;
    for (const p of poly) { cx += p.x; cy += p.y; }
    cx /= poly.length; cy /= poly.length;
    const d = Math.hypot(cx - 1008, cy - 1053);
    if (d < shopBest && d < 90) { shopBest = d; shopIdx = bi; }
  }
  for (let bi = 0; bi < list.length; bi++) {
    const b = list[bi];
    if (!(b.z_ground > -5 && b.z_ground < 200)) continue;   // drop insane ground z
    const poly = toPoly(b.verts);
    if (poly.length < 3) continue;
    if (Math.abs(polyArea(poly)) < 1.0) continue;            // sliver
    const zb = b.z_ground - 1.5;                             // sink base: no floating gap
    const zt = b.z_ground + Math.max(b.height || 0, 3.0);
    const hash = fr(Math.sin(bi * 12.9898 + 3.1) * 43758.5453);
    const kind = bi === shopIdx ? 1 : 0;
    const N = poly.length;
    for (let i = 0; i < N; i++) {                            // walls
      const a = poly[i], c = poly[(i + 1) % N];
      const ex = c.x - a.x, ey = c.y - a.y, el = Math.hypot(ex, ey);
      if (el < 1e-4) continue;
      const nx = ey / el, ny = -ex / el;                     // outward (CCW)
      V.push(a.x, a.y, zb, nx, ny, 0, hash, kind);
      V.push(c.x, c.y, zb, nx, ny, 0, hash, kind);
      V.push(c.x, c.y, zt, nx, ny, 0, hash, kind);
      V.push(a.x, a.y, zb, nx, ny, 0, hash, kind);
      V.push(c.x, c.y, zt, nx, ny, 0, hash, kind);
      V.push(a.x, a.y, zt, nx, ny, 0, hash, kind);
    }
    for (const t of earClip(poly)) {                         // roof cap
      for (const vi of t) { const p = poly[vi]; V.push(p.x, p.y, zt, 0, 0, 1, hash, kind); }
    }
  }
  // a handful of parked cars in the gliderport dirt lot only (~1063,1058) — it
  // always has cars + wing bags. small dark rounded-ish boxes, no detail.
  const pushBox = (cx, cy, cz, hx, hy, hz, yaw) => {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const rot = (x, y) => [cx + x * c - y * s, cy + x * s + y * c];
    const faces = [
      { n: [c, s, 0],   q: [[hx, -hy, -hz], [hx, hy, -hz], [hx, hy, hz], [hx, -hy, hz]] },
      { n: [-c, -s, 0], q: [[-hx, hy, -hz], [-hx, -hy, -hz], [-hx, -hy, hz], [-hx, hy, hz]] },
      { n: [-s, c, 0],  q: [[hx, hy, -hz], [-hx, hy, -hz], [-hx, hy, hz], [hx, hy, hz]] },
      { n: [s, -c, 0],  q: [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz]] },
      { n: [0, 0, 1],   q: [[-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]] },
    ];
    for (const f of faces) {
      const w = f.q.map(p => { const r = rot(p[0], p[1]); return [r[0], r[1], cz + p[2]]; });
      const T = (a, b, d) => { for (const k of [a, b, d]) V.push(w[k][0], w[k][1], w[k][2], f.n[0], f.n[1], f.n[2], 0, 2); };
      T(0, 1, 2); T(0, 2, 3);
    }
  };
  const rnd = (seed => () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff)(7);
  for (let i = 0; i < 8; i++) {
    const row = i % 4, col = i < 4 ? 0 : 1;
    const cx = 1050 + col * 6.5 + (rnd() - 0.5) * 1.2;
    const cy = 1048 + row * 5.2 + (rnd() - 0.5) * 1.0;
    const yaw = 1.05 + (rnd() - 0.5) * 0.25;                 // roughly parked in a row
    pushBox(cx, cy, hAtM(cx, cy) + 0.75, 2.3, 1.0, 0.75, yaw);
  }
  return new Float32Array(V);
}

// parking -> flat triangulated polys; stride 4 (pos3, surf: 0 dirt/sand, 1 paved)
function buildParking(list) {
  const V = [];
  for (const p of list) {
    if (!(p.z_ground > -5 && p.z_ground < 200)) continue;
    const poly = toPoly(p.verts);
    if (poly.length < 3 || Math.abs(polyArea(poly)) < 4) continue;
    const z = p.z_ground + 0.25;
    const surf = (p.surface === 'dirt' || p.surface === 'sand') ? 0 : 1;
    for (const t of earClip(poly)) for (const vi of t) { const q = poly[vi]; V.push(q.x, q.y, z, surf); }
  }
  return new Float32Array(V);
}

// polylines -> ribbon triangles; stride 4 (pos3, acrossT [-1,1])
function buildRibbon(list, widthFn, zOff) {
  const V = [];
  for (const r of list) {
    const pts = r.pts, n = pts.length / 3;
    if (n < 2) continue;
    const hw = Math.max(widthFn(r), 1.0) * 0.5;
    for (let i = 0; i < n - 1; i++) {
      const ax = pts[i * 3], ay = pts[i * 3 + 1], az = pts[i * 3 + 2];
      const bx = pts[(i + 1) * 3], by = pts[(i + 1) * 3 + 1], bz = pts[(i + 1) * 3 + 2];
      let dx = bx - ax, dy = by - ay; const dl = Math.hypot(dx, dy);
      if (dl < 1e-3) continue;
      const px = -dy / dl * hw, py = dx / dl * hw;
      const aL = [ax + px, ay + py, az + zOff], aR = [ax - px, ay - py, az + zOff];
      const bL = [bx + px, by + py, bz + zOff], bR = [bx - px, by - py, bz + zOff];
      const P = (p, t) => V.push(p[0], p[1], p[2], t);
      P(aL, 1); P(aR, -1); P(bR, -1);
      P(aL, 1); P(bR, -1); P(bL, 1);
    }
  }
  return new Float32Array(V);
}

// ------------------------------------------------------------ WGSL
const WGSL_COMMON = /* wgsl */`
struct Params {
  simDims : vec4<f32>,   // NX, NY, NZ, dx (m)
  domain  : vec4<f32>,   // DX, DY, DZ, time (s)
  wind    : vec4<f32>,   // inflow speed m/s, inflow angle rad, dt, slider01
  hmap    : vec4<f32>,   // HX, HY, hdx m/texel, unused
  box0    : vec4<f32>,   // obstacle box center xyz (m), w = on (0/1)
  box1    : vec4<f32>,   // obstacle box half-extents xyz (m), w unused
  fx      : vec4<f32>,   // x = streaklet pulse spawn flag, y = s since pulse, zw unused
};
@group(0) @binding(0) var<uniform> P : Params;

// the floating obstacle box, treated as solid wherever it is
fn inBox(pm : vec3<f32>) -> bool {
  if (P.box0.w < 0.5) { return false; }
  let d = abs(pm - P.box0.xyz);
  return all(d <= P.box1.xyz);
}
fn cellPos(i : vec3<i32>) -> vec3<f32> { return (vec3<f32>(i) + 0.5) * P.simDims.w; }
fn inflowDir() -> vec2<f32> { return vec2<f32>(cos(P.wind.y), sin(P.wind.y)); }

fn NXu() -> u32 { return u32(P.simDims.x); }
fn NYu() -> u32 { return u32(P.simDims.y); }
fn NZu() -> u32 { return u32(P.simDims.z); }
fn idx3(i : vec3<u32>) -> u32 { return i.x + NXu() * (i.y + NYu() * i.z); }

fn hash1(n : f32) -> f32 { return fract(sin(n) * 43758.5453123); }

// wind speed factor with height (rough log profile, ~1 at 100 m)
fn windProfile(z : f32) -> f32 {
  let z0 = 2.0;
  return clamp(log((z + z0) / z0) / log(102.0 / 2.0), 0.05, 1.35);
}
`;

// velocity trilerp needs the vel buffer; injected where used
const WGSL_SAMPLEVEL = /* wgsl */`
fn sampleVel(pm : vec3<f32>) -> vec3<f32> {
  let dims = vec3<f32>(P.simDims.xyz);
  let c = clamp(pm / P.simDims.w - 0.5, vec3<f32>(0.0), dims - 1.001);
  let i0 = vec3<u32>(floor(c));
  let f = c - floor(c);
  let i1 = min(i0 + vec3<u32>(1u), vec3<u32>(dims) - vec3<u32>(1u));
  let v000 = velIn[idx3(vec3<u32>(i0.x, i0.y, i0.z))].xyz;
  let v100 = velIn[idx3(vec3<u32>(i1.x, i0.y, i0.z))].xyz;
  let v010 = velIn[idx3(vec3<u32>(i0.x, i1.y, i0.z))].xyz;
  let v110 = velIn[idx3(vec3<u32>(i1.x, i1.y, i0.z))].xyz;
  let v001 = velIn[idx3(vec3<u32>(i0.x, i0.y, i1.z))].xyz;
  let v101 = velIn[idx3(vec3<u32>(i1.x, i0.y, i1.z))].xyz;
  let v011 = velIn[idx3(vec3<u32>(i0.x, i1.y, i1.z))].xyz;
  let v111 = velIn[idx3(vec3<u32>(i1.x, i1.y, i1.z))].xyz;
  let v00 = mix(v000, v100, f.x); let v10 = mix(v010, v110, f.x);
  let v01 = mix(v001, v101, f.x); let v11 = mix(v011, v111, f.x);
  return mix(mix(v00, v10, f.y), mix(v01, v11, f.y), f.z);
}
`;

const WGSL_HEIGHT = /* wgsl */`
fn terrainHeight(pxy : vec2<f32>) -> f32 {
  let hx = P.hmap.x; let hy = P.hmap.y;
  let c = clamp(vec2<f32>(pxy.x / P.hmap.z, pxy.y / (P.domain.y / hy)) - 0.5,
                vec2<f32>(0.0), vec2<f32>(hx - 1.001, hy - 1.001));
  let i0 = vec2<u32>(floor(c));
  let f = c - floor(c);
  let i1 = min(i0 + vec2<u32>(1u), vec2<u32>(u32(hx) - 1u, u32(hy) - 1u));
  let W = u32(hx);
  let h00 = height[i0.y * W + i0.x]; let h10 = height[i0.y * W + i1.x];
  let h01 = height[i1.y * W + i0.x]; let h11 = height[i1.y * W + i1.x];
  return mix(mix(h00, h10, f.x), mix(h01, h11, f.x), f.y);
}
`;

const ADVECT_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> velIn : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> velOut : array<vec4<f32>>;
@group(0) @binding(3) var<storage, read> solid : array<u32>;
` + WGSL_SAMPLEVEL + /* wgsl */`
@compute @workgroup_size(4, 4, 4)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  if (id.x >= NXu() || id.y >= NYu() || id.z >= NZu()) { return; }
  let n = idx3(id);
  let pm = (vec3<f32>(id) + 0.5) * P.simDims.w;
  if (solid[n] == 1u || inBox(pm)) { velOut[n] = vec4<f32>(0.0); return; }
  let back = pm - velIn[n].xyz * P.wind.z;

// per-glider layout (stride 32):
// 0-2 pos | 3 mode (0 fly, 1 flare, 2 sitting, 3 hiking, 4 blown) | 4 timer
// 5 phase | 6 trailHead | 7 heading | 8-10 desired pos | 11 frame
// 12 down flag (0 mesa, 1 beach, 2 water) | 13 hike stage | 14-16 carried vel
// 17 tumble | 18 launch grace | 19 gliding-out (sunk out, making for the beach)

fn figurePoint(tau : f32, gi : u32) -> vec3<f32> {
  // mirrored swoop along the cliff edge: hover A, swoop down-across, hover B.
  // each glider works his own stretch of ridge, his own rhythm.
  var axA = array<f32, ${NG}>(0.395, 0.400, 0.390, 0.405);
  var ayA = array<f32, ${NG}>(0.39, 0.56, 0.24, 0.42);
  var byA = array<f32, ${NG}>(0.60, 0.74, 0.42, 0.57);
  var hhA = array<f32, ${NG}>(46.0, 54.0, 40.0, 78.0);
  let ax = P.domain.x * axA[gi];           // just seaward of the cliff lip
  let ay = P.domain.y * ayA[gi];
  let by = P.domain.y * byA[gi];
  let hoverH = hhA[gi];                     // above local terrain
  let hA = terrainHeight(vec2<f32>(P.domain.x * 0.44, ay)) + hoverH;
  let hB = terrainHeight(vec2<f32>(P.domain.x * 0.44, by)) + hoverH;
  var pos : vec3<f32>;
  if (tau < 0.18) {                        // hover A (small drift circle)
    let a = tau / 0.18 * 6.2831;
    pos = vec3<f32>(ax + sin(a) * 9.0, ay + cos(a) * 9.0, hA);
  } else if (tau < 0.5) {                  // swoop A -> B, dipping
    let s = (tau - 0.18) / 0.32;
    let e = s * s * (3.0 - 2.0 * s);
    pos = vec3<f32>(ax, mix(ay, by, e), mix(hA, hB, e) - 30.0 * sin(3.14159 * s));
  } else if (tau < 0.68) {                 // hover B
    let a = (tau - 0.5) / 0.18 * 6.2831;
    pos = vec3<f32>(ax + sin(a) * 9.0, by - cos(a) * 9.0, hB);
  } else {                                 // swoop back
    let s = (tau - 0.68) / 0.32;
    let e = s * s * (3.0 - 2.0 * s);
    pos = vec3<f32>(ax, mix(by, ay, e), mix(hB, hA, e) - 30.0 * sin(3.14159 * s));
  }
  return pos;
}

@compute @workgroup_size(${NG})
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  let gi = id.x;
  if (gi >= ${NG}u) { return; }
  let o = gi * 32u;
  let dt = P.wind.z;
  var pos = vec3<f32>(G[o], G[o + 1u], G[o + 2u]);
  var mode = G[o + 3u];
  var timer = G[o + 4u];
  var phase = G[o + 5u];
  var heading = G[o + 7u];
  var downOn = G[o + 12u];
  var stage = G[o + 13u];
  var cvel = vec3<f32>(G[o + 14u], G[o + 15u], G[o + 16u]);
  var tumble = G[o + 17u];
  var grace = G[o + 18u];
  var glideOut = G[o + 19u];
  var clearTrail = false;
  let ground = terrainHeight(pos.xy);

  if (mode < 0.5) {                        // ---- flying the figure
    grace = max(grace - dt, 0.0);
    var perA = array<f32, ${NG}>(26.0, 31.0, 23.0, 36.0);
    phase = fract(phase + dt / perA[gi]);
    var want = figurePoint(phase, gi);
    let air = sampleVel(pos);
    // sunk below usable lift: give up the figure, glide for the beach —
    // unless the wind is past outrunning, in which case landing isn't the story
    if (glideOut < 0.5 && grace <= 0.0 && pos.z < ground + 22.0 && air.z < 0.4 &&
        length(air.xy) < 13.0) { glideOut = 1.0; }
    if (glideOut > 0.5) {
      // caught the lift band on the way out — or the wind rose past outrunning
      if (air.z > 1.8 || length(air.xy) > 16.0) { glideOut = 0.0; }
      else {
        // make for the sand; lazy S-turns along the shoreline bleed the altitude
        let sweep = sin(P.domain.w * 0.45 + f32(gi) * 2.1) * 90.0;
        want = vec3<f32>(P.domain.x * 0.345, pos.y + sweep, 0.0);
      }
    }
    // intent: fly toward the target. more wind = bar pulled in = more airspeed
    // (real hang-glider behavior), topping out ~27 m/s — the solver's crest jet
    // runs ~3x nominal inflow, so station-holding is measured against that
    let trim = clamp(12.5 + P.wind.x * 1.6, 12.5, 27.0);
    let err = want - pos;
    var cmd = err * 0.6;
    let hmag = length(cmd.xy);
    if (hmag > trim) { cmd = vec3<f32>(cmd.xy * (trim / hmag), cmd.z); }
    // he can flatten the glide but can't climb without the air's help;
    // gliding out he commits — spills weak lift, holds a real approach slope
    cmd.z = clamp(cmd.z, select(-3.0, -2.0, glideOut > 0.5), 0.35);
    var liftC = air.z;
    if (glideOut > 0.5) { liftC = min(air.z, 0.4); }
    // the deal: he always sinks 1.05 m/s through the airmass
    var vel = air + cmd;
    vel.z = liftC + cmd.z - 1.05;
    pos += vel * dt;
    if (length(vel.xy) > 0.5) { heading = atan2(vel.y, vel.x); }

    if (grace <= 0.0 && pos.z < ground + 5.0) {    // flare and land
      mode = 1.0;
      cvel = vec3<f32>(vel.xy, 0.0);
      let cm = length(cvel.xy);
      if (cm > 9.0) { cvel = vec3<f32>(cvel.xy * (9.0 / cm), 0.0); }
    }
    if (inBox(pos)) {                              // clipped the box: flutter down
      mode = 1.0; cvel = vec3<f32>(vel.xy * 0.3, 0.0);
    }
    // hopelessly downwind of the ridge in big air = already lost, don't wait for the edge;
    // in extreme wind, merely being behind the lip is already the end of the story
    let hopeless = (pos.x > P.domain.x * 0.75 && P.wind.x > 15.0) ||
                   (pos.x > P.domain.x * 0.44 && P.wind.x > 25.0);
    if (hopeless || pos.x < 8.0 || pos.x > P.domain.x - 8.0 ||
        pos.y < 8.0 || pos.y > P.domain.y - 8.0 ||
        pos.z > P.domain.z - 6.0) {
      // the wind wins: carried up and over the back, out of the sim's world
      mode = 4.0; timer = 12.0; tumble = 0.0;
      var v2 = vel;
      v2 = vec3<f32>(v2.xy + inflowDir() * max(P.wind.x, 8.0) * 0.8, v2.z);
      let vm = length(v2.xy);
      let vmin = max(P.wind.x * 1.3, 14.0);
      if (vm < vmin) { v2 = vec3<f32>(v2.xy * (vmin / max(vm, 0.001)), v2.z); }
      v2.z = max(v2.z, max(P.wind.x * 0.55, 7.0));   // way up, then away
      cvel = v2;
    }
    G[o + 8u] = want.x; G[o + 9u] = want.y; G[o + 10u] = want.z;
  } else if (mode < 1.5) {                 // ---- flare: level off, slow, settle
    cvel = vec3<f32>(cvel.xy * exp(-1.1 * dt),
                     clamp(-(pos.z - ground - 1.2) * 0.6, -3.0, 2.0));
    pos += cvel * dt;
    if (pos.z < ground + 1.0) { pos.z = ground + 1.0; }
    if (length(cvel.xy) > 0.5) { heading = atan2(cvel.y, cvel.x); }
    if (abs(pos.z - ground - 1.2) < 0.5 && length(cvel.xy) < 1.4) {
      pos.z = ground + 1.2;
      mode = 2.0;                          // sitting: catch his breath
      timer = 6.0 + hash1(f32(gi) * 7.7 + P.domain.w) * 5.0;
      downOn = select(select(0.0, 1.0, ground < 15.0), 2.0, ground < 0.5);
      // where to join the trail: beach/water walk it all, mid-cliff joins partway,
      // mesa landings just walk back to launch
      stage = select(select(4.0, 2.0, ground < 60.0), 0.0, ground < 15.0);
      glideOut = 0.0;
    }
  } else if (mode < 2.5) {                 // ---- sitting
    timer -= dt;
    if (timer <= 0.0) { mode = 3.0; }
  } else if (mode < 3.5) {                 // ---- hiking back up the trail
    // real line of low relief: the ravine just south of the gliderport
    var wpx = array<f32, 5>(835.0, 905.0, 955.0, 1005.0, 1000.0);
    var wpy = array<f32, 5>(830.0, 845.0, 825.0, 862.0, 950.0);
    let ti = u32(clamp(stage, 0.0, 4.0));
    let d = vec2<f32>(wpx[ti], wpy[ti]) - pos.xy;
    let dm = length(d);
    if (dm < 14.0) {
      stage += 1.0;
      if (stage > 4.5) {                   // back at the lip: launch again
        mode = 0.0; phase = 0.0; grace = 4.0; glideOut = 0.0;
        pos = vec3<f32>(pos.xy, ground + 4.0);
        heading = 3.14159;                 // facing west, into the wind
        clearTrail = true;
      }
    } else {
      let nxy = pos.xy + d / dm * (13.0 * dt);
      pos = vec3<f32>(nxy, terrainHeight(nxy) + 2.0);
      heading = atan2(d.y, d.x);
    }
  } else {                                 // ---- blown away: tumbling downwind
    timer -= dt;
    tumble += dt * (2.2 + f32(gi) * 0.3);
    cvel.z -= 1.8 * dt;                    // the arc comes back over, gently
    cvel *= 1.0 - 0.02 * dt;
    pos += cvel * dt;
    if (length(cvel.xy) > 0.5) { heading = atan2(cvel.y, cvel.x); }
    if (timer <= 0.0) {
      pos = figurePoint(0.0, gi);
      mode = 0.0; phase = 0.0; grace = 2.0; tumble = 0.0; glideOut = 0.0;
      clearTrail = true;
    }
  }

  // trail ring buffer, ~10 Hz — protagonist only, recorded while airborne
  let frame = G[o + 11u] + 1.0;
  G[o + 11u] = frame;
  if (gi == 0u) {
    if (clearTrail) {                      // fresh flight, fresh line
      for (var i = 0u; i < ${TRAIL_N}u; i++) { trail[i] = vec4<f32>(pos, 0.0); }
      G[o + 6u] = 0.0;
    } else if ((mode < 1.5 || mode > 3.5) && (u32(frame) % 3u) == 0u) {
      let head = u32(G[o + 6u]);
      trail[head] = vec4<f32>(pos, 1.0);
      G[o + 6u] = f32((head + 1u) % ${TRAIL_N}u);
    }
  }

  G[o] = pos.x; G[o + 1u] = pos.y; G[o + 2u] = pos.z;

// ------------------------------------------------------------ render WGSL
const CAM_WGSL = /* wgsl */`
struct Cam {
  viewProj : mat4x4<f32>,
  invViewProj : mat4x4<f32>,
  eye : vec4<f32>,       // xyz eye, w time
  sun : vec4<f32>,       // xyz dir-to-sun, w wind slider
  misc : vec4<f32>,      // x aspect, y focal (1/tan(fov/2)), z reveal, w unused
  wind : vec4<f32>,      // xy ambient inflow (m/s, east/north), z speed m/s, w unused
};
@group(0) @binding(0) var<uniform> C : Cam;

fn fogMix(dist : f32) -> f32 { return 1.0 - exp(-dist * 0.00019); }
const FOG_COL = vec3<f32>(0.30, 0.26, 0.27);
const SUN_COL = vec3<f32>(1.0, 0.62, 0.34);
fn hash2(p : vec2<f32>) -> f32 {
  var q = fract(p * vec2<f32>(234.34, 435.345));
  q += dot(q, q + 34.23);
  return fract(q.x * q.y);
}
fn vnoise2(p : vec2<f32>) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash2(i), hash2(i + vec2<f32>(1.0, 0.0)), u.x),
             mix(hash2(i + vec2<f32>(0.0, 1.0)), hash2(i + vec2<f32>(1.0, 1.0)), u.x), u.y);
}
`;

const SKY_WGSL = CAM_WGSL + /* wgsl */`
struct VOut { @builtin(position) pos : vec4<f32>, @location(0) ndc : vec2<f32> };
@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VOut {
  let p = vec2<f32>(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0;
  var o : VOut;
  o.pos = vec4<f32>(p, 0.9999, 1.0);
  o.ndc = p;
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let pw = C.invViewProj * vec4<f32>(v.ndc, 0.6, 1.0);
  let dir = normalize(pw.xyz / pw.w - C.eye.xyz);
  let up = clamp(dir.z, -0.15, 1.0);
  // dusk over the ocean; C.misc.z (the reveal) pulls the sun down
  let rv = C.misc.z;
  var col = mix(vec3<f32>(0.34, 0.25, 0.24), vec3<f32>(0.065, 0.09, 0.15), smoothstep(-0.02, 0.55, up)) * (1.0 - 0.40 * rv);
  let sunAmt = pow(max(dot(dir, normalize(C.sun.xyz)), 0.0), 42.0);
  col += SUN_COL * sunAmt * 0.9 * (1.0 - 0.85 * rv);
  col += SUN_COL * pow(max(dot(dir, normalize(C.sun.xyz)), 0.0), 4.0) * 0.07 * (1.0 - 0.85 * rv);
  // a few early stars up high
  let sp = dir.xy / max(dir.z, 0.2) * 60.0;
  let cell = floor(sp);
  let hs = fract(sin(dot(cell, vec2<f32>(127.1, 311.7))) * 43758.5453);
  if (hs > 0.994 && dir.z > 0.3) {
    let f = fract(sp) - 0.5;
    col += vec3<f32>(0.8) * exp(-dot(f, f) * 60.0) * (hs - 0.994) * 120.0 * smoothstep(0.3, 0.6, dir.z);
  }
  col += (hash2(v.ndc * 913.7) - 0.5) * 0.006;   // dither the gradient
  return vec4<f32>(col, 1.0);
}`;

const TERRAIN_WGSL = CAM_WGSL + /* wgsl */`
@group(0) @binding(1) var<storage, read> height : array<f32>;
// dims: HX, HY, hdx, hdy | orig: originX, originY, zBias, surround flag
// (the coarse coastline surround reuses this pipeline with its own DEM + origin;
//  it sits 1.5 m low and is cut away under the detailed domain, leaving a ~55 m
//  underlap ring so the seam never gaps)
struct TP { dims : vec4<f32>, orig : vec4<f32> };
@group(0) @binding(2) var<uniform> T : TP;

struct VOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) world : vec3<f32>,
  @location(1) normal : vec3<f32>,
};
fn hAt(i : i32, j : i32) -> f32 {
  let W = i32(T.dims.x); let H = i32(T.dims.y);
  let ci = clamp(i, 0, W - 1); let cj = clamp(j, 0, H - 1);
  return height[cj * W + ci];
}
@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VOut {
  let W = u32(T.dims.x);
  let i = i32(vi % W); let j = i32(vi / W);
  let h = hAt(i, j);
  let world = vec3<f32>(T.orig.x + (f32(i) + 0.5) * T.dims.z,
                        T.orig.y + (f32(j) + 0.5) * T.dims.w, h + T.orig.z);
  let nx = hAt(i - 1, j) - hAt(i + 1, j);
  let ny = hAt(i, j - 1) - hAt(i, j + 1);
  var o : VOut;
  o.pos = C.viewProj * vec4<f32>(world, 1.0);
  o.world = world;
  o.normal = normalize(vec3<f32>(nx / (2.0 * T.dims.z), ny / (2.0 * T.dims.w), 1.0));
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let h = v.world.z - T.orig.z;
  if (h < 0.4) { discard; }                             // the apron plane is the water
  if (T.orig.w > 0.5 &&
      v.world.x > 55.0 && v.world.x < ${(DX - 55).toFixed(1)} &&
      v.world.y > 55.0 && v.world.y < ${(DY - 55).toFixed(1)}) { discard; }  // detail domain owns its rectangle
  let n = normalize(v.normal);
  let sun = normalize(C.sun.xyz);
  let slope = 1.0 - n.z;
  let mottle = vnoise2(v.world.xy * 0.011) * 0.5 + vnoise2(v.world.xy * 0.043) * 0.5;
  let sand = vec3<f32>(0.50, 0.43, 0.33);
  let sandstone = vec3<f32>(0.52, 0.40, 0.27) * (0.85 + 0.3 * mottle);
  let sage = vec3<f32>(0.27, 0.28, 0.21) * (0.8 + 0.4 * mottle);
  var albedo = mix(sage, sandstone, smoothstep(0.20, 0.48, slope));
  albedo = mix(sand, albedo, smoothstep(2.5, 9.0, h));  // beach band
  let diff = max(dot(n, sun), 0.0);
  let skyAmb = 0.5 + 0.3 * n.z;
  let rv = C.misc.z;
  var col = albedo * (SUN_COL * diff * (1.0 - 0.78 * rv) + vec3<f32>(0.40, 0.44, 0.58) * skyAmb * 0.6 * (1.0 - 0.30 * rv));
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;

// the sea: one huge plane under everything, fresnel toward the dusk sky
const APRON_WGSL = CAM_WGSL + /* wgsl */`
struct VOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) world : vec3<f32>,
};
@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VOut {
  let corner = vec2<f32>(f32(vi & 1u), f32((vi >> 1u) & 1u)) * 2.0 - 1.0;
  let world = vec3<f32>(corner * 30000.0 + vec2<f32>(1200.0, 1000.0), -0.4);
  var o : VOut;
  o.pos = C.viewProj * vec4<f32>(world, 1.0);
  o.world = world;
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let sun = normalize(C.sun.xyz);
  let vd = normalize(C.eye.xyz - v.world);
  // gentle swell tilting the normal
  let t = C.eye.w;
  let sw = vnoise2(v.world.xy * 0.004 + vec2<f32>(t * 0.03, 0.0)) - 0.5;
  let n = normalize(vec3<f32>(sw * 0.14, sw * 0.10, 1.0));
  let deep = vec3<f32>(0.055, 0.095, 0.115);
  let skyH = vec3<f32>(0.36, 0.27, 0.25);              // horizon color reflected
  let fres = pow(1.0 - max(dot(vd, n), 0.0), 3.0);
  let rv = C.misc.z;
  var col = mix(deep, skyH, fres * 0.75) * (1.0 - 0.35 * rv);
  let refl = reflect(-sun, n);
  col += SUN_COL * pow(max(dot(vd, refl), 0.0), 90.0) * 0.8 * (1.0 - 0.85 * rv);
  col += SUN_COL * pow(max(dot(vd, refl), 0.0), 7.0) * 0.06 * (1.0 - 0.85 * rv);
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;

const PART_RENDER_WGSL = CAM_WGSL + /* wgsl */`
@group(0) @binding(1) var<storage, read> parts : array<vec4<f32>>;
struct VOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) uv : vec2<f32>,
  @location(1) col : vec3<f32>,
};
@vertex
fn vs(@builtin(vertex_index) vi : u32, @builtin(instance_index) inst : u32) -> VOut {
  let p = parts[inst * 2u];
  let st = parts[inst * 2u + 1u];
  let corner = vec2<f32>(f32(vi & 1u), f32((vi >> 1u) & 1u)) * 2.0 - 1.0;
  var o : VOut;
  let clip = C.viewProj * vec4<f32>(p.xyz, 1.0);
  // haze wisps: varied size; flat when drifting, stretched tall when rising
  let dist = distance(C.eye.xyz, p.xyz);
  let riseT = clamp(p.w / 2.5, 0.0, 1.0);
  let sizeM = mix(13.0, 34.0, fract(st.w * 7.31)) * clamp(dist / 400.0, 0.35, 1.0)
            * mix(1.0, 0.6, C.misc.z);              // reveal: tighter grain, less stacking
  let vScale = 0.62 + riseT * 0.42;                 // streamers elongate upward
  o.pos = clip + vec4<f32>(corner * sizeM * vec2<f32>(C.misc.y / C.misc.x, C.misc.y * vScale), 0.0, 0.0);
  o.uv = corner;
  // birth/death envelope, near-camera fade, distance-fog softening
  let env = smoothstep(0.0, 4.0, st.x) * (1.0 - smoothstep(st.y - 5.0, st.y, st.x));
  let vis = env * smoothstep(60.0, 300.0, dist) * (1.0 - fogMix(dist) * 0.65);
  // BASE register: sun-lit haze, no data color. Forward scatter warms wisps
  // between eye and sun; churn (curl) thickens them so rotors visibly boil.
  let mu = max(dot(normalize(p.xyz - C.eye.xyz), normalize(C.sun.xyz)), 0.0);
  let baseCol = mix(vec3<f32>(0.40, 0.37, 0.43), SUN_COL * 1.25, 0.22 + 0.60 * pow(mu, 2.5));
  let strat = 0.35 + 0.65 * exp(-p.xyz.z / 140.0);   // marine layer sits low
  let baseA = vis * (0.007 + 0.022 * st.z) * strat;
  // REVEAL register (C.misc.z): same haze re-lit from within by vertical velocity
  let w = p.w;
  let rising = pow(clamp(w / 4.0, 0.0, 1.0), 2.0);
  let sinking = pow(clamp(-w / 2.5, 0.0, 1.0), 2.0);
  let revCol = vec3<f32>(1.0, 0.55, 0.16) * rising
             + vec3<f32>(1.0, 0.88, 0.66) * rising * rising * 0.5   // white-hot core
             + vec3<f32>(0.12, 0.55, 0.58) * sinking;
  let revA = vis * (rising * 0.019 + sinking * 0.012 + 0.0010);
  o.col = mix(baseCol * baseA, revCol * revA, C.misc.z);
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let g = exp(-dot(v.uv, v.uv) * mix(2.6, 2.0, C.misc.z));   // creamier in reveal
  return vec4<f32>(v.col * g, 1.0);
}`;

// summonable streaklet pulse: short comet-tailed segments riding the flow
const STREAK_RENDER_WGSL = CAM_WGSL + /* wgsl */`
@group(0) @binding(1) var<storage, read> strk : array<vec4<f32>>;
struct VOut { @builtin(position) pos : vec4<f32>, @location(0) col : vec3<f32> };
@vertex
fn vs(@builtin(vertex_index) vi : u32, @builtin(instance_index) inst : u32) -> VOut {
  let a = strk[inst * 2u];
  let v = strk[inst * 2u + 1u];
  var o : VOut;
  let age = a.w;
  let spd = length(v.xyz);
  let life = 3.0 + fract(v.w * 3.71) * 1.2;
  var env = smoothstep(0.0, 0.25, age) * (1.0 - smoothstep(life * 0.55, life, age));
  if (age < 0.0 || age > life) { env = 0.0; }
  let endT = f32(vi >> 1u);                       // 0 head, 1 tail
  let side = f32(vi & 1u) * 2.0 - 1.0;
  let dir = v.xyz / max(spd, 1e-3);
  let tlen = clamp(spd * 2.2, 4.0, 90.0);         // tail length = speed, naturally
  let clipH = C.viewProj * vec4<f32>(a.xyz, 1.0);
  let clipT = C.viewProj * vec4<f32>(a.xyz - dir * tlen, 1.0);
  let d2 = (clipT.xy / max(clipT.w, 0.05) - clipH.xy / max(clipH.w, 0.05)) * vec2<f32>(C.misc.x, 1.0);
  var perp = vec2<f32>(0.0, 1.0);

  var clip = mix(clipH, clipT, endT);
  let halfW = max(0.90, clip.w * 0.0010);         // ~1px floor at vista distance
  o.pos = vec4<f32>(clip.xy + perp * side * halfW * vec2<f32>(C.misc.y / C.misc.x, C.misc.y), clip.zw);
  let dist = distance(C.eye.xyz, a.xyz);
  let nearF = smoothstep(120.0, 420.0, dist) * (1.0 - fogMix(dist) * 0.6);
  let aH = env * nearF * (0.04 + 0.18 * smoothstep(2.0, 8.0, spd)) * (1.0 - endT);
  o.col = vec3<f32>(1.0, 0.90, 0.75) * aH;
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> { return vec4<f32>(v.col, 1.0); }`;

const TRAIL_WGSL = CAM_WGSL + /* wgsl */`
@group(0) @binding(1) var<storage, read> trail : array<vec4<f32>>;

const INTENT_WGSL = CAM_WGSL + /* wgsl */`

// a soft glow so the eye can find him at vista distance (protagonist only);

const GLIDER_GLOW_WGSL = CAM_WGSL + /* wgsl */`

fn vs(@builtin(vertex_index) vi : u32) -> VOut {

const GLIDER_RENDER_WGSL = CAM_WGSL + /* wgsl */`

fn fs(v : VOut) -> @location(0) vec4<f32> { return vec4<f32>(v.c, 1.0); }`;

struct Params {
  simDims : vec4<f32>, domain : vec4<f32>, wind : vec4<f32>, hmap : vec4<f32>,
  box0 : vec4<f32>, box1 : vec4<f32>, fx : vec4<f32>,

    vec2<f32>(-1.0, -1.0), vec2<f32>(1.0, -1.0), vec2<f32>(1.0, 1.0),

@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let n = normalize(v.normal);
  let sun = normalize(C.sun.xyz);
  let diff = max(dot(n, sun), 0.0);
  let skyAmb = 0.5 + 0.34 * n.z;
  // warm dark slab — weathered timber register, nothing techy
  let mottle = vnoise2(v.world.xy * 0.06 + v.world.zz * 0.06) * 0.3 + 0.85;
  let albedo = vec3<f32>(0.21, 0.165, 0.125) * mottle;
  let rv = C.misc.z;
  var col = albedo * (SUN_COL * diff * 1.15 * (1.0 - 0.78 * rv) + vec3<f32>(0.40, 0.44, 0.58) * skyAmb * 0.55 * (1.0 - 0.30 * rv));
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;

// real trees from the 2014 lidar canopy: crossed alpha-cut quads, dark crowns
// warm-edged by the low sun, leaning and shivering with the local wind
const TREE_WGSL = CAM_WGSL + /* wgsl */`
@group(0) @binding(1) var<storage, read> trees : array<f32>;      // x, y, zg, h, r per tree
@group(0) @binding(2) var<storage, read> velIn : array<vec4<f32>>;

fn windAt(pm : vec3<f32>) -> vec3<f32> {
  // inside the sim domain: nearest-cell solved velocity; outside: ambient inflow
  if (pm.x > 0.0 && pm.x < ${DX.toFixed(1)} && pm.y > 0.0 && pm.y < ${DY.toFixed(1)}) {
    let g = clamp(vec3<i32>(pm / ${DXM.toFixed(4)}), vec3<i32>(0), vec3<i32>(${NX - 1}, ${NY - 1}, ${NZ - 1}));
    return velIn[u32(g.x) + ${NX}u * (u32(g.y) + ${NY}u * u32(g.z))].xyz;
  }
  return vec3<f32>(C.wind.xy * 0.5, 0.0);   // ~crown-height share of the inflow
}

struct VOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) uv : vec2<f32>,          // x -1..1 across, y 0..1 base -> tip
  @location(1) world : vec3<f32>,
  @location(2) aux : vec3<f32>,         // plane axis xy, seed
};
@vertex
fn vs(@builtin(vertex_index) vi : u32, @builtin(instance_index) inst : u32) -> VOut {
  let t0 = inst * 5u;
  let base = vec3<f32>(trees[t0], trees[t0 + 1u], trees[t0 + 2u]);
  let ht = trees[t0 + 3u];
  let rad = trees[t0 + 4u];
  var corners = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, 0.0), vec2<f32>(1.0, 0.0), vec2<f32>(1.0, 1.0),
    vec2<f32>(-1.0, 0.0), vec2<f32>(1.0, 1.0), vec2<f32>(-1.0, 1.0));
  let c = corners[vi % 6u];
  let seed = fract(f32(inst) * 0.61803);
  let ang = seed * 3.14159 + f32(vi / 6u) * 1.5708;   // two crossed planes, per-tree rotation
  let axis = vec2<f32>(cos(ang), sin(ang));
  // crowns lean with the wind at crown height, tip more than base
  let v = windAt(base + vec3<f32>(0.0, 0.0, ht * 0.7));
  let spd = length(v.xy);
  var lean = v.xy * 0.13;
  let leanCap = ht * 0.30;
  let lm = length(lean);
  if (lm > leanCap) { lean *= leanCap / lm; }
  let shiv = sin(C.eye.w * (1.9 + seed * 1.6) + seed * 39.0) * 0.02 * spd;
  let bendT = c.y * c.y;
  let world = vec3<f32>(
    base.xy + axis * (c.x * max(rad * 1.15, ht * 0.24)) + (lean + vec2<f32>(-axis.y, axis.x) * shiv) * bendT,
    base.z - 2.0 + c.y * (ht + 2.0));     // rooted 2 m deep: no floating on the coarse DEM
  var o : VOut;
  o.pos = C.viewProj * vec4<f32>(world, 1.0);
  o.uv = c;
  o.world = world;
  o.aux = vec3<f32>(axis, seed);
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let uv = v.uv;
  // crown: noise-broken ellipse over the upper 2/3; a thin stem below it
  let q = vec2<f32>(uv.x / 0.95, (uv.y - 0.68) / 0.34);
  let d = length(q) + (vnoise2(uv * vec2<f32>(4.0, 7.0) + v.aux.z * 43.0) - 0.5) * 0.55;
  let trunk = abs(uv.x) < 0.045 && uv.y < 0.68;
  if (d > 1.0 && !trunk) { discard; }
  // fake rounded normal so the west side catches the last of the sun
  let n = normalize(vec3<f32>(v.aux.x * q.x * 0.8, v.aux.y * q.x * 0.8, max(q.y, -0.2) * 0.5 + 0.55));
  let sun = normalize(C.sun.xyz);
  let diff = max(dot(n, sun), 0.0);
  let mottle = vnoise2(v.world.xy * 0.9 + v.aux.z * 17.0);
  var albedo = vec3<f32>(0.105, 0.125, 0.085) * (0.7 + 0.6 * mottle);
  if (trunk && d > 1.0) { albedo = vec3<f32>(0.15, 0.115, 0.09); }
  let rv = C.misc.z;
  var col = albedo * (SUN_COL * diff * 1.35 * (1.0 - 0.78 * rv)
                    + vec3<f32>(0.40, 0.44, 0.58) * 0.30 * (1.0 - 0.30 * rv));
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;

// real OSM structures — buildings, parking, roads, trails. Static geometry built
// once at boot into a few vertex buffers; dusk register, quiet warm masses.
// Buildings: extruded footprint prisms (walls + ear-clipped roof cap), dark warm
// albedo varied per building, faint west-face sun, a few sparse lit windows.
const BUILDING_WGSL = CAM_WGSL + /* wgsl */`
struct VOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) world : vec3<f32>,
  @location(1) normal : vec3<f32>,
  @location(2) info : vec2<f32>,        // x hash (per-building), y kind (0 bldg, 1 shop, 2 car)
};
@vertex
fn vs(@location(0) p : vec3<f32>, @location(1) n : vec3<f32>, @location(2) info : vec2<f32>) -> VOut {
  var o : VOut;
  o.pos = C.viewProj * vec4<f32>(p, 1.0);
  o.world = p;
  o.normal = n;
  o.info = info;
  return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let n = normalize(v.normal);
  let sun = normalize(C.sun.xyz);
  let diff = max(dot(n, sun), 0.0);
  let skyAmb = 0.5 + 0.34 * n.z;
  let hash = v.info.x;
  let kind = v.info.y;
  let rv = C.misc.z;
  // dark warm mass, slight per-building variation; the shop a touch warmer/livelier
  var albedo = vec3<f32>(0.150, 0.128, 0.112) * (0.72 + 0.55 * hash);
  if (kind > 0.5 && kind < 1.5) { albedo = vec3<f32>(0.205, 0.150, 0.112); }
  if (kind > 1.5)               { albedo = vec3<f32>(0.052, 0.058, 0.072); }  // parked car
  var col = albedo * (SUN_COL * diff * (1.0 - 0.78 * rv)
                    + vec3<f32>(0.40, 0.44, 0.58) * skyAmb * 0.5 * (1.0 - 0.30 * rv));
  // a subtle roofline lift: brighten the very top band of walls (near-silhouette east
  // faces still read an edge). purely cosmetic; scenery.
  // sparse lit windows on near-vertical faces — warm dots, dim in the reveal
  let isWall = abs(n.z) < 0.5;
  if (isWall && kind < 1.5) {
    let horiz = select(v.world.x, v.world.y, abs(n.x) > abs(n.y));
    let gh = 3.7; let gv = 3.7;                 // ~one window per storey
    let cellH = floor(horiz / gh);
    let cellV = floor(v.world.z / gv);
    let seed = fract(sin(cellH * 12.9898 + cellV * 78.233 + hash * 57.3) * 43758.5453);
    let litFrac = select(0.05, 0.20, kind > 0.5);   // the shop feels inhabited
    if (seed < litFrac && v.world.z > 3.0) {
      let u = fract(horiz / gh) - 0.5;
      let w = fract(v.world.z / gv) - 0.5;
      if (abs(u) < 0.27 && abs(w) < 0.33) {         // a centered pane, not the whole cell
        let warm = vec3<f32>(1.0, 0.70, 0.36);
        let glow = select(0.80, 1.25, kind > 0.5) * (0.55 + 0.45 * fract(seed * 91.0));
        col += warm * glow * (1.0 - 0.85 * rv);
      }
    }
  }
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;

// flat surfaces a few cm above terrain — parking lots. dirt = sandy clearing (the
// gliderport lot), paved = darker/cooler patch. y-attr: 0 dirt/sand, 1 paved.
const PARKING_WGSL = CAM_WGSL + /* wgsl */`
struct VOut { @builtin(position) pos : vec4<f32>, @location(0) world : vec3<f32>, @location(1) surf : f32 };
@vertex
fn vs(@location(0) p : vec3<f32>, @location(1) surf : f32) -> VOut {
  var o : VOut; o.pos = C.viewProj * vec4<f32>(p, 1.0); o.world = p; o.surf = surf; return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let rv = C.misc.z;
  let mottle = vnoise2(v.world.xy * 0.05) * 0.16 + 0.9;
  let dirt  = vec3<f32>(0.285, 0.238, 0.170);  // sandy dirt lot (kept quiet, not pale)
  let paved = vec3<f32>(0.115, 0.120, 0.135);  // cool worn asphalt
  var col = mix(dirt, paved, step(0.5, v.surf)) * mottle;
  col *= (1.0 - 0.5 * rv);                      // scenery dims in the reveal
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;

// road / trail ribbons — worn quiet tone, center marginally lighter. t-attr is
// across-width in [-1,1]. no lane markings, no glowing edges.
const ribbonWGSL = (edge, center) => CAM_WGSL + /* wgsl */`
struct VOut { @builtin(position) pos : vec4<f32>, @location(0) world : vec3<f32>, @location(1) t : f32 };
@vertex
fn vs(@location(0) p : vec3<f32>, @location(1) t : f32) -> VOut {
  var o : VOut; o.pos = C.viewProj * vec4<f32>(p, 1.0); o.world = p; o.t = t; return o;
}
@fragment
fn fs(v : VOut) -> @location(0) vec4<f32> {
  let rv = C.misc.z;
  let mid = 1.0 - abs(v.t);
  var col = mix(vec3<f32>(${edge}), vec3<f32>(${center}), smoothstep(0.30, 1.0, mid));
  col *= (1.0 - 0.5 * rv);
  col = mix(col, FOG_COL * (1.0 - 0.45 * rv), fogMix(distance(C.eye.xyz, v.world)));
  return vec4<f32>(col, 1.0);
}`;
const ROAD_WGSL  = ribbonWGSL('0.100, 0.100, 0.115', '0.150, 0.150, 0.155');
const TRAIL_R_WGSL = ribbonWGSL('0.30, 0.25, 0.185', '0.40, 0.34, 0.25');

// ------------------------------------------------------------ boot
const canvas = $('c');
async function boot() {
  if (!navigator.gpu) throw new Error('no webgpu');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('no adapter');
  const device = await adapter.requestDevice();
  device.onuncapturederror ??= e => console.error('WebGPU:', e.error?.message || e);
  device.addEventListener?.('uncapturederror', e => console.error('WebGPU:', e.error.message));
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();

  // ---------- buffers
  const NC = NX * NY * NZ;
  const mkBuf = (size, usage) => device.createBuffer({ size, usage });
  const vel   = mkBuf(NC * 16, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC);
  const probeRead = mkBuf(16, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ);
  const velT  = mkBuf(NC * 16, GPUBufferUsage.STORAGE);
  const pr0   = mkBuf(NC * 4, GPUBufferUsage.STORAGE);
  const pr1   = mkBuf(NC * 4, GPUBufferUsage.STORAGE);
  const div   = mkBuf(NC * 4, GPUBufferUsage.STORAGE);
  const solidB= mkBuf(NC * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
  const heightB = mkBuf(HX * HY * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
  const partsB  = mkBuf(NP * 32, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
  const streakB = mkBuf(NS * 32, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
  const gliderB = mkBuf(NG * 32 * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC);
  const trailB  = mkBuf(TRAIL_N * 16, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
  const gliderRead = mkBuf(NG * 32 * 4, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ);
  const paramsB = mkBuf(112, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
  const camB    = mkBuf(192, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
  const terrainUB = mkBuf(32, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
  const intentB = mkBuf(256 * 16, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
  const coastB  = COAST ? mkBuf(COAST.width * COAST.height * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST) : null;
  const coastUB = COAST ? mkBuf(32, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST) : null;
  const treesB  = TREES ? mkBuf(TREES.count * TREES.stride * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST) : null;

  // ---------- initial data
  const height = makeHeightfield();
  device.queue.writeBuffer(heightB, 0, height);
  device.queue.writeBuffer(solidB, 0, makeSolid(height));
  device.queue.writeBuffer(terrainUB, 0, new Float32Array([HX, HY, DX / HX, DY / HY, 0, 0, 0, 0]));
  if (COAST) {
    // the 3DEP surround clamps surf + sand to 0, so its shore falls straight into
    // the sea and the detail domain's wide beach ends in a hard corner; dilate the
    // land edge ~2 cells (~70 m) seaward into a low sand shelf so the beach ribbon
    // continues through the seam and up the whole coast
    const cd = decodeF32(COAST.b64);
    const CW = COAST.width, CH = COAST.height;
    const shelf = new Float32Array(cd);
    for (let j = 0; j < CH; j++) for (let i = 0; i < CW; i++) {
      if (cd[j * CW + i] > 0.4) continue;
      let near = false;
      for (let dj = -2; dj <= 2 && !near; dj++) for (let di = -2; di <= 2; di++) {
        const jj = j + dj, ii = i + di;
        if (jj >= 0 && jj < CH && ii >= 0 && ii < CW && cd[jj * CW + ii] > 0.5) { near = true; break; }
      }
      if (near) shelf[j * CW + i] = 1.2;
    }
    device.queue.writeBuffer(coastB, 0, shelf);
    device.queue.writeBuffer(coastUB, 0, new Float32Array([
      COAST.width, COAST.height, COAST.extentX / COAST.width, COAST.extentY / COAST.height,
      COAST.originX, COAST.originY, -0.5, 1]));   // 0.5 m low + masked: detail wins the seam
      // (history: -1.5 m drowned the surround's low beach under the ocean plane —
      //  the shoreline snapped inland and the domain's SW corner read as a hard cut)
  }
  if (TREES) device.queue.writeBuffer(treesB, 0, decodeF32(TREES.b64));

  const parts = new Float32Array(NP * 8);
  const hAtM = (x, y) => {
    const i = Math.min(HX - 1, Math.max(0, Math.floor(x / DX * HX)));
    const j = Math.min(HY - 1, Math.max(0, Math.floor(y / DY * HY)));
    return height[j * HX + i];
  };
  for (let k = 0; k < NP; k++) {
    const x = Math.random() * DX, y = Math.random() * DY;
    parts[k * 8] = x; parts[k * 8 + 1] = y;
    parts[k * 8 + 2] = hAtM(x, y) + 3 + Math.pow(Math.random(), 1.5) * (DZ * 0.7);
    parts[k * 8 + 3] = 0;
    const life = 20 + Math.random() * 26;
    parts[k * 8 + 4] = Math.random() * life;   // staggered ages: no global blink
    parts[k * 8 + 5] = life;
    parts[k * 8 + 6] = 0;                      // churn
    parts[k * 8 + 7] = Math.random() * 100;    // seed
  }
  device.queue.writeBuffer(partsB, 0, parts);

  {  // streaklets start dead; a pulse (S) reseeds them
    const strk = new Float32Array(NS * 8);
    for (let k = 0; k < NS; k++) strk[k * 8 + 3] = 9;
    device.queue.writeBuffer(streakB, 0, strk);
  }

  // each glider starts at his own hover A, phases staggered so the ridge feels inhabited
  const gInit = new Float32Array(NG * 32);
  {
    const axA = [0.395, 0.400, 0.390, 0.405];
    const ayA = [0.39, 0.56, 0.24, 0.42];
    const hhA = [46, 54, 40, 78];
    const ph = [0, 0.31, 0.57, 0.82];
    for (let i = 0; i < NG; i++) {
      const o = i * 32;
      gInit[o] = DX * axA[i]; gInit[o + 1] = DY * ayA[i];
      gInit[o + 2] = hAtM(DX * 0.44, DY * ayA[i]) + hhA[i];
      gInit[o + 5] = ph[i]; gInit[o + 7] = Math.PI / 2; gInit[o + 18] = 2;
    }
  }
  device.queue.writeBuffer(gliderB, 0, gInit);

  // intent figure polyline for the ghost path (mirrors figurePoint in WGSL)
  {
    const pts = new Float32Array(256 * 4);
    const ax = DX * 0.395, ay = DY * 0.39, by = DY * 0.60;
    const hA = hAtM(DX * 0.44, ay) + 46, hB = hAtM(DX * 0.44, by) + 46;
    for (let k = 0; k < 256; k++) {
      const tau = k / 255;
      let x = ax, y, z;
      if (tau < 0.18) { const a = tau / 0.18 * Math.PI * 2; x = ax + Math.sin(a) * 9; y = ay + Math.cos(a) * 9; z = hA; }
      else if (tau < 0.5) { const s = (tau - 0.18) / 0.32, e = s * s * (3 - 2 * s); y = ay + (by - ay) * e; z = hA + (hB - hA) * e - 30 * Math.sin(Math.PI * s); }
      else if (tau < 0.68) { const a = (tau - 0.5) / 0.18 * Math.PI * 2; x = ax + Math.sin(a) * 9; y = by - Math.cos(a) * 9; z = hB; }
      else { const s = (tau - 0.68) / 0.32, e = s * s * (3 - 2 * s); y = by + (ay - by) * e; z = hB + (hA - hB) * e - 30 * Math.sin(Math.PI * s); }
      pts[k * 4] = x; pts[k * 4 + 1] = y; pts[k * 4 + 2] = z; pts[k * 4 + 3] = 1;
    }
    device.queue.writeBuffer(intentB, 0, pts);
  }

  // ---------- real structures: build static vertex buffers once from the OSM data
  let struct = null;
  if (STRUCT) {
    const vbuf = (arr) => {
      const b = device.createBuffer({ size: Math.max(arr.byteLength, 4), usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
      if (arr.byteLength) device.queue.writeBuffer(b, 0, arr);
      return b;
    };
    const classW = { motorway: 18, motorway_link: 9, trunk: 14, primary: 11, primary_link: 6,
                     secondary: 9, secondary_link: 5, tertiary: 7, tertiary_link: 4,
                     residential: 6, living_street: 5, unclassified: 6, service: 4,
                     pedestrian: 3.5, track: 3, footway: 2, path: 2 };
    const roadW = (r) => {
      let w = r.width || classW[r.cls] || 5;
      if (r.cls && r.cls.indexOf('motorway') === 0) w = Math.max(w, 16);
      return w;
    };
    const bld = buildBuildings(STRUCT.buildings || [], hAtM);
    const park = buildParking(STRUCT.parking || []);
    const road = buildRibbon(STRUCT.roads || [], roadW, 0.40);
    const trail = buildRibbon(STRUCT.trails || [], () => 1.4, 0.50);
    struct = {
      bldVB: vbuf(bld),   bldN: bld.length / 8,
      parkVB: vbuf(park), parkN: park.length / 4,
      roadVB: vbuf(road), roadN: road.length / 4,
      trailVB: vbuf(trail), trailN: trail.length / 4,
    };
    console.log(`structures: ${struct.bldN / 3 | 0} bldg-tris, ${struct.roadN / 3 | 0} road-tris, ` +
                `${struct.parkN / 3 | 0} park-tris, ${struct.trailN / 3 | 0} trail-tris`);
  }

  // ---------- pipelines
  const cs = (code) => device.createComputePipeline({
    layout: 'auto',
    compute: { module: device.createShaderModule({ code }), entryPoint: 'main' },
  });
  const pAdvect = cs(ADVECT_WGSL);
  const pDiv = cs(DIV_WGSL);
  const pJacobi = cs(JACOBI_WGSL);
  const pProject = cs(PROJECT_WGSL);
  const pParts = cs(PARTICLE_WGSL);
  const pStreak = cs(STREAK_WGSL);
  const pGlider = cs(GLIDER_WGSL);

  const bg = (pipe, entries) => device.createBindGroup({
    layout: pipe.getBindGroupLayout(0),
    entries: entries.map((b, i) => ({ binding: i, resource: { buffer: b } })),
  });
  const bgAdvect = bg(pAdvect, [paramsB, vel, velT, solidB]);
  const bgDiv = bg(pDiv, [paramsB, velT, div, solidB]);
  const bgJacobiA = bg(pJacobi, [paramsB, pr0, div, pr1, solidB]);
  const bgJacobiB = bg(pJacobi, [paramsB, pr1, div, pr0, solidB]);
  const bgProject = bg(pProject, [paramsB, velT, pr0, vel, solidB]);
  const bgParts = bg(pParts, [paramsB, vel, partsB, heightB]);
  const bgStreak = bg(pStreak, [paramsB, vel, streakB, heightB]);
  const bgGlider = bg(pGlider, [paramsB, vel, gliderB, heightB, trailB]);

  const depthFormat = 'depth24plus';
  let depthTex = null;

  const rp = (code, { blend = null, topology = 'triangle-list', depthWrite = true, depthCompare = 'less', buffers = undefined } = {}) => {
    const module = device.createShaderModule({ code });
    const target = { format };
    if (blend) target.blend = blend;
    return device.createRenderPipeline({
      layout: 'auto',
      vertex: { module, entryPoint: 'vs', buffers },
      fragment: { module, entryPoint: 'fs', targets: [target] },
      primitive: { topology, cullMode: 'none' },
      depthStencil: { format: depthFormat, depthWriteEnabled: depthWrite, depthCompare },
    });
  };
  // vertex layouts for the static structure geometry
  const VL_BLDG = [{ arrayStride: 32, attributes: [
    { shaderLocation: 0, offset: 0, format: 'float32x3' },
    { shaderLocation: 1, offset: 12, format: 'float32x3' },
    { shaderLocation: 2, offset: 24, format: 'float32x2' }] }];
  const VL_FLAT = [{ arrayStride: 16, attributes: [
    { shaderLocation: 0, offset: 0, format: 'float32x3' },
    { shaderLocation: 1, offset: 12, format: 'float32' }] }];

      // real OSM structures: flat decals (roads/parking/trails) then extruded buildings
      if (struct) {
        if (struct.roadN)  { r.setPipeline(pRoad); r.setBindGroup(0, bgRoad); r.setVertexBuffer(0, struct.roadVB); r.draw(struct.roadN); }
        if (struct.parkN)  { r.setPipeline(pPark); r.setBindGroup(0, bgPark); r.setVertexBuffer(0, struct.parkVB); r.draw(struct.parkN); }
        if (struct.trailN) { r.setPipeline(pPath); r.setBindGroup(0, bgPath); r.setVertexBuffer(0, struct.trailVB); r.draw(struct.trailN); }
        if (struct.bldN)   { r.setPipeline(pBldg); r.setBindGroup(0, bgBldg); r.setVertexBuffer(0, struct.bldVB); r.draw(struct.bldN); }
      }
      if (bgTree) { r.setPipeline(pTree); r.setBindGroup(0, bgTree); r.draw(12, TREES.count); }
      if (box.on) { r.setPipeline(pBox); r.setBindGroup(0, bgBox); r.draw(36); }
      r.setPipeline(pIntent); r.setBindGroup(0, bgIntent); r.draw(256);
      r.setPipeline(pTrail); r.setBindGroup(0, bgTrail); r.draw(TRAIL_N);
      r.setPipeline(pPartR); r.setBindGroup(0, bgPartR); r.draw(4, NP);
      if (pulseActive) { r.setPipeline(pStreakR); r.setBindGroup(0, bgStreakR); r.draw(4, NS); }
      r.setPipeline(pGliderR); r.setBindGroup(0, bgGliderR); r.draw(6, NG);
      r.setPipeline(pGlow); r.setBindGroup(0, bgGlow); r.draw(4);
      r.end();
    };
    drawScene(ctx.getCurrentTexture().createView(), depthTex.createView());

    // record a velocity probe copy (mapped at the top of next frame)
    if (probeReq && !probeInFlight && !probeMapping) {
      const pr = probeReq; probeReq = null;
      const ci = Math.max(0, Math.min(NX - 1, Math.floor(pr.x / DXM)));
      const cj = Math.max(0, Math.min(NY - 1, Math.floor(pr.y / DXM)));
      const ck = Math.max(0, Math.min(NZ - 1, Math.floor(pr.z / DXM)));
      enc.copyBufferToBuffer(vel, (ci + NX * (cj + NY * ck)) * 16, probeRead, 0, 16);
      probeInFlight = pr;
    }

    // offscreen capture for tooling (window.__capture() → dataURL promise)
    if (captureReq) {
      const req = captureReq; captureReq = null;
      const cw = 896, ch = 560;
      const capTex = device.createTexture({ size: [cw, ch], format,
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
      const capDepth = device.createTexture({ size: [cw, ch], format: depthFormat,
        usage: GPUTextureUsage.RENDER_ATTACHMENT });
      const capBuf = device.createBuffer({ size: cw * 4 * ch,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      drawScene(capTex.createView(), capDepth.createView());
      enc.copyTextureToBuffer({ texture: capTex }, { buffer: capBuf, bytesPerRow: cw * 4 }, [cw, ch]);
      device.queue.submit([enc.finish()]);
      capBuf.mapAsync(GPUMapMode.READ).then(() => {
        const bytes = new Uint8Array(capBuf.getMappedRange().slice(0));
        capBuf.unmap(); capTex.destroy(); capDepth.destroy(); capBuf.destroy();
        const c2 = document.createElement('canvas');
        c2.width = cw; c2.height = ch;
        const g = c2.getContext('2d');
        const img = g.createImageData(cw, ch);
        const bgra = format === 'bgra8unorm';
        for (let i = 0; i < cw * ch; i++) {
          img.data[i * 4]     = bytes[i * 4 + (bgra ? 2 : 0)];
          img.data[i * 4 + 1] = bytes[i * 4 + 1];
          img.data[i * 4 + 2] = bytes[i * 4 + (bgra ? 0 : 2)];
          img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        req(c2.toDataURL('image/png'));
      }).catch(e => req('ERROR: ' + e));
      readout.textContent = readoutText(wind);
      return;   // this frame's commands already submitted
    }

    // occasional glider state readback for the HUD
    if (frameN % 20 === 0 && !readingBack) {
      enc.copyBufferToBuffer(gliderB, 0, gliderRead, 0, NG * 32 * 4);
      readingBack = true;
      device.queue.submit([enc.finish()]);
      gliderRead.mapAsync(GPUMapMode.READ).then(() => {
        const g = new Float32Array(gliderRead.getMappedRange().slice(0));
        gliderRead.unmap();
        readingBack = false;
        gLast = g;
        gliderLabel.textContent = 'glider: ' + gliderText(g);
      }).catch(() => { readingBack = false; });
    } else {
      device.queue.submit([enc.finish()]);
    }

    readout.textContent = readoutText(wind);
  }
  requestAnimationFrame(frame);
}

boot().catch(e => {
  console.error(e);
  $('err').style.display = 'grid';
});
</script>
</body>
</html>
