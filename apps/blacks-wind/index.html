<script>
'use strict';
// ============================================================================
// OVER BLACKS — v0
// A 3D incompressible flow solve (WebGPU compute) over the real USGS lidar
// of the Torrey Pines gliderport (analytic stand-in if data/terrain.js is
// missing). Onshore wind enters from the west, has nowhere to go but up.
// A little glider tries to fly his figure; the wind edits it.
// ============================================================================

// ------------------------------------------------------------ configuration
const TERRAIN = window.BLACKS_TERRAIN || null;
const TINY = new URLSearchParams(location.search).has('tiny');  // headless smoke tests

const NX = TINY ? 76 : 152, NY = TINY ? 64 : 128, NZ = TINY ? 20 : 40;
const DX = TERRAIN ? TERRAIN.extentX : 2400;      // meters east-west
const DXM = DX / NX;                              // cubic cell size
const DY = NY * DXM, DZ = NZ * DXM;               // ≈2021 × ≈632 m at full res
const HX = TERRAIN ? TERRAIN.width : 304;         // heightfield resolution
const HY = TERRAIN ? TERRAIN.height : 256;
const NP = TINY ? 8192 : 65536;                   // haze wisps (fewer, larger, softer)
const NS = TINY ? 512 : 4096;                     // summonable streaklets
const JACOBI = TINY ? 8 : 18;
const TRAIL_N = 256;
// gliderport in local meters (from lidar metadata; fallback ≈ center of cliff)
const GPORT = TERRAIN ? TERRAIN.gliderportXY : [DX * 0.42, DY * 0.49];

const $ = id => document.getElementById(id);

// ------------------------------------------------------------ terrain
function makeHeightfield() {
  if (TERRAIN) {
    const bin = atob(TERRAIN.b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Float32Array(bytes.buffer);   // south-first rows, meters
  }
  return makeAnalytic();
}
// Analytic stand-in: beach at ~2 m, sharp west-facing cliff to a ~105 m mesa.
function makeAnalytic() {
  const h = new Float32Array(HX * HY);
  const rand2 = (x, y) => {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };
  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return rand2(xi, yi) * (1 - u) * (1 - v) + rand2(xi + 1, yi) * u * (1 - v)
         + rand2(xi, yi + 1) * (1 - u) * v + rand2(xi + 1, yi + 1) * u * v;
  };
  const fbm = (x, y) => noise(x, y) * 0.5 + noise(x * 2.1, y * 2.1) * 0.25 + noise(x * 4.3, y * 4.3) * 0.125;

  for (let j = 0; j < HY; j++) {
    for (let i = 0; i < HX; i++) {
      const x = i / HX, y = j / HY;             // 0..1 across domain
      // cliff edge line wanders in y; ocean occupies the west ~35%
      const edge = 0.40 + 0.05 * Math.sin(y * 5.2) + 0.04 * (fbm(3 + y * 6, 7.7) - 0.5);
      const t = (x - edge) / 0.055;             // cliff width ~130 m
      let elev = 2 + 103 * smooth01(t);
      // mesa relief + canyon notch to the north (Blacks canyon-ish)
      if (x > edge) {
        elev += 14 * (fbm(x * 9, y * 9) - 0.5);
        const cy = (y - 0.78), cx = (x - edge - 0.10);
        const canyon = Math.exp(-(cy * cy) / 0.004) * Math.exp(-(cx * cx) / 0.01);
        elev -= 55 * canyon * smooth01((x - edge) / 0.05);
      }
      // ocean west of the beach
      const beach = 0.33 + 0.015 * Math.sin(y * 8.0);
      if (x < beach) elev = 0;
      else if (x < edge) elev = 2 + 3 * (x - beach) / (edge - beach);
      h[j * HX + i] = Math.max(elev, 0);
    }
  }
  return h;
}
function smooth01(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// solid mask at sim resolution from the heightfield
function makeSolid(height) {
  const s = new Uint32Array(NX * NY * NZ);
  for (let k = 0; k < NZ; k++) {
    const z = (k + 0.5) * DXM;
    for (let j = 0; j < NY; j++) {
      const hy = Math.min(HY - 1, Math.floor((j + 0.5) / NY * HY));
      for (let i = 0; i < NX; i++) {
        const hx = Math.min(HX - 1, Math.floor((i + 0.5) / NX * HX));
        if (z < height[hy * HX + hx]) s[i + NX * (j + NY * k)] = 1;
      }
    }
  }
  return s;
}

// ------------------------------------------------------------ WGSL
const WGSL_COMMON = /* wgsl */`
struct Params {
  simDims : vec4<f32>,   // NX, NY, NZ, dx (m)
  domain  : vec4<f32>,   // DX, DY, DZ, time (s)
  wind    : vec4<f32>,   // inflow speed m/s, inflow angle rad, dt, slider01
  hmap    : vec4<f32>,   // HX, HY, hdx m/texel, unused
  box0    : vec4<f32>,   // obstacle box center xyz (m), w = on (0/1)
  box1    : vec4<f32>,   // obstacle box half-extents xyz (m), w unused
  fx      : vec4<f32>,   // x = streaklet pulse spawn flag, y = s since pulse, zw unused
};
@group(0) @binding(0) var<uniform> P : Params;

// the floating obstacle box, treated as solid wherever it is
fn inBox(pm : vec3<f32>) -> bool {
  if (P.box0.w < 0.5) { return false; }
  let d = abs(pm - P.box0.xyz);
  return all(d <= P.box1.xyz);
}
fn cellPos(i : vec3<i32>) -> vec3<f32> { return (vec3<f32>(i) + 0.5) * P.simDims.w; }
fn inflowDir() -> vec2<f32> { return vec2<f32>(cos(P.wind.y), sin(P.wind.y)); }

fn NXu() -> u32 { return u32(P.simDims.x); }
fn NYu() -> u32 { return u32(P.simDims.y); }
fn NZu() -> u32 { return u32(P.simDims.z); }
fn idx3(i : vec3<u32>) -> u32 { return i.x + NXu() * (i.y + NYu() * i.z); }

fn hash1(n : f32) -> f32 { return fract(sin(n) * 43758.5453123); }

// wind speed factor with height (rough log profile, ~1 at 100 m)
fn windProfile(z : f32) -> f32 {
  let z0 = 2.0;
  return clamp(log((z + z0) / z0) / log(102.0 / 2.0), 0.05, 1.35);
}
`;

// velocity trilerp needs the vel buffer; injected where used
const WGSL_SAMPLEVEL = /* wgsl */`
fn sampleVel(pm : vec3<f32>) -> vec3<f32> {
  let dims = vec3<f32>(P.simDims.xyz);
  let c = clamp(pm / P.simDims.w - 0.5, vec3<f32>(0.0), dims - 1.001);
  let i0 = vec3<u32>(floor(c));
  let f = c - floor(c);
  let i1 = min(i0 + vec3<u32>(1u), vec3<u32>(dims) - vec3<u32>(1u));
  let v000 = velIn[idx3(vec3<u32>(i0.x, i0.y, i0.z))].xyz;
  let v100 = velIn[idx3(vec3<u32>(i1.x, i0.y, i0.z))].xyz;
  let v010 = velIn[idx3(vec3<u32>(i0.x, i1.y, i0.z))].xyz;
  let v110 = velIn[idx3(vec3<u32>(i1.x, i1.y, i0.z))].xyz;
  let v001 = velIn[idx3(vec3<u32>(i0.x, i0.y, i1.z))].xyz;
  let v101 = velIn[idx3(vec3<u32>(i1.x, i0.y, i1.z))].xyz;
  let v011 = velIn[idx3(vec3<u32>(i0.x, i1.y, i1.z))].xyz;
  let v111 = velIn[idx3(vec3<u32>(i1.x, i1.y, i1.z))].xyz;
  let v00 = mix(v000, v100, f.x); let v10 = mix(v010, v110, f.x);
  let v01 = mix(v001, v101, f.x); let v11 = mix(v011, v111, f.x);
  return mix(mix(v00, v10, f.y), mix(v01, v11, f.y), f.z);
}
`;

const WGSL_HEIGHT = /* wgsl */`
fn terrainHeight(pxy : vec2<f32>) -> f32 {
  let hx = P.hmap.x; let hy = P.hmap.y;
  let c = clamp(vec2<f32>(pxy.x / P.hmap.z, pxy.y / (P.domain.y / hy)) - 0.5,
                vec2<f32>(0.0), vec2<f32>(hx - 1.001, hy - 1.001));
  let i0 = vec2<u32>(floor(c));
  let f = c - floor(c);
  let i1 = min(i0 + vec2<u32>(1u), vec2<u32>(u32(hx) - 1u, u32(hy) - 1u));
  let W = u32(hx);
  let h00 = height[i0.y * W + i0.x]; let h10 = height[i0.y * W + i1.x];
  let h01 = height[i1.y * W + i0.x]; let h11 = height[i1.y * W + i1.x];
  return mix(mix(h00, h10, f.x), mix(h01, h11, f.x), f.y);
}
`;

const ADVECT_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> velIn : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> velOut : array<vec4<f32>>;
@group(0) @binding(3) var<storage, read> solid : array<u32>;
` + WGSL_SAMPLEVEL + /* wgsl */`
@compute @workgroup_size(4, 4, 4)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  if (id.x >= NXu() || id.y >= NYu() || id.z >= NZu()) { return; }
  let n = idx3(id);
  let pm = (vec3<f32>(id) + 0.5) * P.simDims.w;
  if (solid[n] == 1u || inBox(pm)) { velOut[n] = vec4<f32>(0.0); return; }
  let back = pm - velIn[n].xyz * P.wind.z;
  var v = sampleVel(back) * 0.999;
  // physical ceiling: real flow here never exceeds ~2.5x inflow (terrain speedup
  // tops out well under that); anything past it is numerical feedback, so bound it
  let vcap = max(P.wind.x * 2.5, 25.0);
  let vmag = length(v);
  if (vmag > vcap) { v *= vcap / vmag; }
  // west face: onshore inflow
  if (id.x <= 1u) { v = vec3<f32>(inflowDir() * P.wind.x * windProfile(pm.z), 0.0); }
  // lid: free-slip
  if (id.z == NZu() - 1u) { v.z = min(v.z, 0.0); }
  velOut[n] = vec4<f32>(v, 0.0);
}`;

const DIV_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> velIn : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> divOut : array<f32>;
@group(0) @binding(3) var<storage, read> solid : array<u32>;

fn velAt(i : vec3<i32>) -> vec3<f32> {
  let d = vec3<i32>(i32(P.simDims.x), i32(P.simDims.y), i32(P.simDims.z));
  let c = clamp(i, vec3<i32>(0), d - 1);
  return velIn[idx3(vec3<u32>(c))].xyz;
}
@compute @workgroup_size(4, 4, 4)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  if (id.x >= NXu() || id.y >= NYu() || id.z >= NZu()) { return; }
  let n = idx3(id);
  let i = vec3<i32>(id);
  if (solid[n] == 1u || inBox(cellPos(i))) { divOut[n] = 0.0; return; }
  let s = 0.5 / P.simDims.w;
  divOut[n] =
      (velAt(i + vec3<i32>(1,0,0)).x - velAt(i - vec3<i32>(1,0,0)).x
     + velAt(i + vec3<i32>(0,1,0)).y - velAt(i - vec3<i32>(0,1,0)).y
     + velAt(i + vec3<i32>(0,0,1)).z - velAt(i - vec3<i32>(0,0,1)).z) * s;
}`;

const JACOBI_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> pIn : array<f32>;
@group(0) @binding(2) var<storage, read> divIn : array<f32>;
@group(0) @binding(3) var<storage, read_write> pOut : array<f32>;
@group(0) @binding(4) var<storage, read> solid : array<u32>;

fn pAt(i : vec3<i32>, pc : f32) -> f32 {
  let d = vec3<i32>(i32(P.simDims.x), i32(P.simDims.y), i32(P.simDims.z));
  if (i.x >= d.x) { return 0.0; }   // east face: open outflow (p = 0) — the pressure outlet
  if (any(i < vec3<i32>(0)) || any(i >= d)) { return pc; }
  let n = idx3(vec3<u32>(i));
  if (solid[n] == 1u || inBox(cellPos(i))) { return pc; }
  return pIn[n];
}
@compute @workgroup_size(4, 4, 4)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  if (id.x >= NXu() || id.y >= NYu() || id.z >= NZu()) { return; }
  let n = idx3(id);
  let i = vec3<i32>(id);
  if (solid[n] == 1u || inBox(cellPos(i))) { pOut[n] = 0.0; return; }
  let pc = pIn[n];
  let dx = P.simDims.w;
  let sum = pAt(i + vec3<i32>(1,0,0), pc) + pAt(i - vec3<i32>(1,0,0), pc)
          + pAt(i + vec3<i32>(0,1,0), pc) + pAt(i - vec3<i32>(0,1,0), pc)
          + pAt(i + vec3<i32>(0,0,1), pc) + pAt(i - vec3<i32>(0,0,1), pc);
  pOut[n] = (sum - divIn[n] * dx * dx) / 6.0;
}`;

const PROJECT_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> velIn : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read> pIn : array<f32>;
@group(0) @binding(3) var<storage, read_write> velOut : array<vec4<f32>>;
@group(0) @binding(4) var<storage, read> solid : array<u32>;

fn pAt(i : vec3<i32>, pc : f32) -> f32 {
  let d = vec3<i32>(i32(P.simDims.x), i32(P.simDims.y), i32(P.simDims.z));
  if (i.x >= d.x) { return 0.0; }   // east face: open outflow (p = 0) — the pressure outlet
  if (any(i < vec3<i32>(0)) || any(i >= d)) { return pc; }
  let n = idx3(vec3<u32>(i));
  if (solid[n] == 1u || inBox(cellPos(i))) { return pc; }
  return pIn[n];
}
@compute @workgroup_size(4, 4, 4)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  if (id.x >= NXu() || id.y >= NYu() || id.z >= NZu()) { return; }
  let n = idx3(id);
  let i = vec3<i32>(id);
  if (solid[n] == 1u || inBox(cellPos(i))) { velOut[n] = vec4<f32>(0.0); return; }
  let pc = pIn[n];
  let s = 0.5 / P.simDims.w;
  var v = velIn[n].xyz - vec3<f32>(
    pAt(i + vec3<i32>(1,0,0), pc) - pAt(i - vec3<i32>(1,0,0), pc),
    pAt(i + vec3<i32>(0,1,0), pc) - pAt(i - vec3<i32>(0,1,0), pc),
    pAt(i + vec3<i32>(0,0,1), pc) - pAt(i - vec3<i32>(0,0,1), pc)) * s;
  let pm = (vec3<f32>(id) + 0.5) * P.simDims.w;
  if (id.x <= 1u) { v = vec3<f32>(inflowDir() * P.wind.x * windProfile(pm.z), 0.0); }
  velOut[n] = vec4<f32>(v, 0.0);
}`;

const PARTICLE_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> velIn : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> parts : array<vec4<f32>>;
@group(0) @binding(3) var<storage, read> height : array<f32>;
` + WGSL_SAMPLEVEL + WGSL_HEIGHT + /* wgsl */`
// haze wisps: pos + w in [2k], (age, life, churn, seed) in [2k+1]
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  let k = id.x;
  if (k * 2u + 1u >= arrayLength(&parts)) { return; }
  var p = parts[k * 2u].xyz;
  var st = parts[k * 2u + 1u];
  let v = sampleVel(p);
  p += v * P.wind.z;
  var w = v.z;
  st.x += P.wind.z;
  // churn: local curl magnitude — rotors boil with haze, laminar air stays glassy
  let h = P.simDims.w;
  let dvx = sampleVel(p + vec3<f32>(h, 0.0, 0.0)) - sampleVel(p - vec3<f32>(h, 0.0, 0.0));
  let dvy = sampleVel(p + vec3<f32>(0.0, h, 0.0)) - sampleVel(p - vec3<f32>(0.0, h, 0.0));
  let dvz = sampleVel(p + vec3<f32>(0.0, 0.0, h)) - sampleVel(p - vec3<f32>(0.0, 0.0, h));
  let curl = vec3<f32>(dvy.z - dvz.y, dvz.x - dvx.z, dvx.y - dvy.x) / (2.0 * h);
  st.z = mix(st.z, clamp(length(curl) / 0.30, 0.0, 1.0), 0.06);
  let t = P.domain.w;
  let sk = f32(k) * 0.618;
  // respawn: swept out, into the ground, or old age (life keeps calm air turning over)
  var dead = st.x > st.y;
  if (p.x > P.domain.x - 10.0 || p.x < 2.0) { dead = true; }
  if (p.y < 2.0 || p.y > P.domain.y - 2.0) { dead = true; }
  if (p.z > P.domain.z - 4.0) { dead = true; }
  if (p.z < terrainHeight(p.xy) + 1.0) { dead = true; }
  if (inBox(p)) { dead = true; }
  if (dead) {
    let r1 = hash1(sk + t * 1.37);
    let r2 = hash1(sk + t * 2.11 + 5.0);
    let r3 = hash1(sk + t * 3.71 + 9.0);
    let r4 = hash1(sk + t * 1.93 + 13.0);
    if (r4 < 0.45) {
      // marine layer feed: spread upstream, hugging low (fade-in hides the seam)
      p = vec3<f32>(P.domain.x * (0.03 + r1 * 0.35), r2 * P.domain.y,
                    4.0 + pow(r3, 1.8) * 150.0);
    } else if (r4 < 0.60) {
      // the lift's intake: low air just off the cliff base, about to be pulled up
      let xy = vec2<f32>(P.domain.x * (0.26 + r1 * 0.14), r2 * P.domain.y);
      p = vec3<f32>(xy, terrainHeight(xy) + 2.0 + pow(r3, 1.5) * 70.0);
    } else {
      // volume fill so the lee and the sky aren't empty
      let xy = vec2<f32>(r1 * P.domain.x, r2 * P.domain.y);
      p = vec3<f32>(xy, terrainHeight(xy) + 3.0 + pow(r3, 1.9) * 330.0);
    }
    w = 0.0;
    st = vec4<f32>(0.0, 24.0 + hash1(sk + t * 4.3 + 21.0) * 24.0, st.z * 0.5, st.w);
  }
  parts[k * 2u] = vec4<f32>(p, w);
  parts[k * 2u + 1u] = st;
}`;

const STREAK_WGSL = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> velIn : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> strk : array<vec4<f32>>;
@group(0) @binding(3) var<storage, read> height : array<f32>;
` + WGSL_SAMPLEVEL + WGSL_HEIGHT + /* wgsl */`
// summonable streaklet pulse: pos + age in [2k], cached vel + seed in [2k+1]
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id : vec3<u32>) {
  let k = id.x;
  if (k * 2u + 1u >= arrayLength(&strk)) { return; }
  var a = strk[k * 2u];

fn figurePoint(tau : f32) -> vec3<f32> {
  // mirrored swoop along the cliff edge: hover A, swoop down-across, hover B
  let ax = P.domain.x * 0.395;             // just seaward of the cliff lip
  let ay = P.domain.y * 0.39;              // ~200 m south of the gliderport
  let by = P.domain.y * 0.60;              // ~200 m north

    pos = vec3<f32>(ax + sin(a) * 9.0, ay + cos(a) * 9.0, hA);
  } else if (tau < 0.5) {                  // swoop A -> B, dipping

    pos = vec3<f32>(ax, mix(ay, by, e), mix(hA, hB, e) - 30.0 * sin(3.14159 * s));
  } else if (tau < 0.68) {                 // hover B
    let a = (tau - 0.5) / 0.18 * 6.2831;

  } else {                                 // swoop back
    let s = (tau - 0.68) / 0.32;

fn main() {
  let dt = P.wind.z;
  var pos = vec3<f32>(G[0], G[1], G[2]);
  var mode = G[3];
  var timer = G[4];
  var phase = G[5];

  if (mode > 0.5) {                        // landed or blown out: wait, respawn
    timer -= dt;
    if (timer <= 0.0) {
      pos = figurePoint(0.0);
      mode = 0.0; phase = 0.0;
    }
  } else {
    phase = fract(phase + dt / 26.0);      // 26 s per full figure
    let want = figurePoint(phase);
    let air = sampleVel(pos);
    // intent: fly toward the figure at up to 11 m/s airspeed
    let err = want - pos;
    var cmd = err * 0.6;
    let hmag = length(cmd.xy);
    if (hmag > 11.0) { cmd = vec3<f32>(cmd.xy * (11.0 / hmag), cmd.z); }
    cmd.z = clamp(cmd.z, -3.0, 1.1);
    // the deal: he always sinks 1.05 m/s through the airmass
    var vel = air + cmd;
    vel.z = air.z + cmd.z - 1.05;
    pos += vel * dt;
    if (length(vel.xy) > 0.5) { G[7] = atan2(vel.y, vel.x); }

    let ground = terrainHeight(pos.xy);
    if (pos.z < ground + 2.0) { mode = 1.0; timer = 3.5; pos.z = ground + 2.0; }
    if (inBox(pos)) { mode = 1.0; timer = 3.5; }   // flew into the box: crash
    if (pos.x < 8.0 || pos.x > P.domain.x - 8.0 ||
        pos.y < 8.0 || pos.y > P.domain.y - 8.0 ||
        pos.z > P.domain.z - 6.0) { mode = 2.0; timer = 3.5; }

  let frame = G[11] + 1.0;
  G[11] = frame;

    let head = u32(G[6]);
    trail[head] = vec4<f32>(pos, 1.0);

    vec2<f32>(-1.0, -1.0), vec2<f32>(1.0, -1.0), vec2<f32>(1.0, 1.0),

  function perspective(fovY, aspectR, near, far) {
    const f = 1 / Math.tan(fovY / 2);
    return new Float32Array([
      f / aspectR, 0, 0, 0,
      0, f, 0, 0,
      0, 0, far / (near - far), -1,
      0, 0, (far * near) / (near - far), 0,
    ]);
  }

  // ---------- wind & UI
  const windSlider = $('wind');
  const readout = $('readout');
  const gliderLabel = $('glider');

  // real day mode: hourly Scripps pier obs for 2026-06-19, ~90 sim-s per hour
  const DAY = window.BLACKS_WINDDAY || null;
  const SEC_PER_HOUR = 90;
  const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  let dayMode = false;
  const dayToggle = $('dayToggle');
  if (!DAY) dayToggle.style.display = 'none';
  dayToggle.addEventListener('click', () => {
    dayMode = !dayMode;
    dayToggle.classList.toggle('on', dayMode);
    windSlider.style.visibility = dayMode ? 'hidden' : 'visible';
  });

  function windNow(t) {
    const gust = 1 + 0.28 * Math.sin(t * 0.21) * Math.sin(t * 0.043 + 1.2)
               + 0.14 * Math.sin(t * 0.9 + Math.sin(t * 0.11) * 3);
    if (dayMode && DAY) {
      const hourF = (t / SEC_PER_HOUR) % 24;               // UTC hour of the looping day
      const i0 = Math.floor(hourF) % 24, i1 = (i0 + 1) % 24, f = hourF % 1;
      const s0 = DAY.samples[i0], s1 = DAY.samples[i1];
      const base = s0.speedMs + (s1.speedMs - s0.speedMs) * f;
      const gustAmp = (s0.gustMs - s0.speedMs) * (1 - f) + (s1.gustMs - s1.speedMs) * f;
      let dd = s1.dirDeg - s0.dirDeg;                      // shortest-path direction lerp
      if (dd > 180) dd -= 360; if (dd < -180) dd += 360;
      const dirDeg = (s0.dirDeg + dd * f + 360) % 360;
      const D = dirDeg * Math.PI / 180;
      // meteorological FROM-direction -> local blowing-toward vector (x east, y north)
      const ang = Math.atan2(-Math.cos(D), -Math.sin(D));
      const ms = Math.max(0, base + gustAmp * Math.max(0, gust - 1) * 2.4);
      return { ms, base, s: Math.min(1, base / 12), ang, hourF, dirDeg };
    }
    const s = windSlider.value / 1000;                    // 0..1
    const base = Math.pow(s, 1.6) * 40;                   // 0..40 m/s (≈90 mph)
    return { ms: Math.max(0, base * gust), base, s, ang: 0 };
  }
  function readoutText(w) {
    const mph = w.ms * 2.237;
    if (dayMode && DAY) {
      const pdt = (w.hourF + 0.333 - 7 + 24) % 24;         // samples land at :20 UTC
      const hh = Math.floor(pdt), mm = Math.floor((pdt - hh) * 60);
      const h12 = ((hh + 11) % 12) + 1, ap = hh < 12 ? 'am' : 'pm';
      const comp = COMPASS[Math.round(w.dirDeg / 22.5) % 16];
      return `jun 19 · ${h12}:${String(mm).padStart(2, '0')} ${ap} · ${mph.toFixed(0)} mph ${comp}`;
    }
    return mph < 1 ? 'dead calm' : `${mph.toFixed(0)} mph onshore`;
  }

  // ---------- resize
  function resize() {
    const dpr = TINY ? 1 : Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.configure({ device, format, alphaMode: 'opaque' });
    depthTex = device.createTexture({
      size: [canvas.width, canvas.height],
      format: depthFormat,
      usage: GPUTextureUsage.RENDER_ATTACHMENT,
    });
  }
  resize();
  addEventListener('resize', resize);

  // ---------- frame
  const wgX = Math.ceil(NX / 4), wgY = Math.ceil(NY / 4), wgZ = Math.ceil(NZ / 4);
  let simTime = 0, last = performance.now();
  let frameN = 0, readingBack = false;
  let captureReq = null, probeInFlight = null, probeMapping = false;
  window.__capture = () => new Promise(res => { captureReq = res; });
  window.__setCam = (azim, elev, dist) => { cam.azim = azim; cam.elev = elev; cam.dist = dist; };
  window.__setWind = v => { windSlider.value = v; };
  const modeNames = ['soaring', 'landed — hiking back up', 'blown out — resetting'];

  function frame(now) {
    requestAnimationFrame(frame);
    // finish a velocity probe whose copy was submitted last frame
    if (probeInFlight && !probeMapping) {
      probeMapping = true;
      const pr = probeInFlight; probeInFlight = null;
      probeRead.mapAsync(GPUMapMode.READ).then(() => {
        const v = new Float32Array(probeRead.getMappedRange().slice(0));
        probeRead.unmap(); probeMapping = false;
        pr.res([v[0], v[1], v[2]]);
      }).catch(() => { probeMapping = false; pr.res(null); });
    }
    const dt = Math.min((now - last) / 1000, 1 / 24);
    last = now;
    simTime += dt;
    frameN++;

    const wind = windNow(simTime);
    // reveal crossfade: ~300 ms toward held state (or a tooling override)
    const rTarget = revealHeld ? 1 : 0;
    revealV += Math.max(-dt / 0.3, Math.min(dt / 0.3, rTarget - revealV));
    const reveal = revealOverride ?? revealV;
    const pulseActive = pulseSpawn || simTime - pulseAt < 6;
    device.queue.writeBuffer(paramsB, 0, new Float32Array([
      NX, NY, NZ, DXM,
      DX, DY, DZ, simTime,
      wind.ms, wind.ang || 0, dt, wind.s,
      HX, HY, DX / HX, 0,
      box.cx, box.cy, box.cz, box.on ? 1 : 0,
      box.hx, box.hy, box.hz, 0,
      pulseSpawn, simTime - pulseAt, 0, 0,
    ]));
    pulseSpawn = 0;

    // camera
    const aspectR = canvas.width / canvas.height;
    const eye = [
      cam.target[0] + Math.cos(cam.azim) * Math.cos(cam.elev) * cam.dist,
      cam.target[1] + Math.sin(cam.azim) * Math.cos(cam.elev) * cam.dist,
      cam.target[2] + Math.sin(cam.elev) * cam.dist,
    ];
    const vp = mat4Mul(perspective(0.9, aspectR, 2, 12000), lookAt(eye, cam.target, [0, 0, 1]));
    const camData = new Float32Array(44);
    camData.set(vp, 0);
    invVpCur = mat4Invert(vp);
    camData.set(invVpCur, 16);
    camData.set([...eye, simTime], 32);
    camData.set([-0.86, 0.20, 0.24, wind.s], 36);   // dir to sun: WNW, low
    camData.set([aspectR, 1 / Math.tan(0.45), reveal, 0], 40);
    device.queue.writeBuffer(camB, 0, camData);

    const enc = device.createCommandEncoder();

    // --- sim
    {
      const c = enc.beginComputePass();
      c.setPipeline(pAdvect); c.setBindGroup(0, bgAdvect); c.dispatchWorkgroups(wgX, wgY, wgZ);
      c.setPipeline(pDiv); c.setBindGroup(0, bgDiv); c.dispatchWorkgroups(wgX, wgY, wgZ);
      c.setPipeline(pJacobi);
      for (let i = 0; i < JACOBI; i++) {
        c.setBindGroup(0, i % 2 === 0 ? bgJacobiA : bgJacobiB);
        c.dispatchWorkgroups(wgX, wgY, wgZ);
      }
      c.setPipeline(pProject); c.setBindGroup(0, bgProject); c.dispatchWorkgroups(wgX, wgY, wgZ);
      c.setPipeline(pParts); c.setBindGroup(0, bgParts); c.dispatchWorkgroups(Math.ceil(NP / 64));
      if (pulseActive) { c.setPipeline(pStreak); c.setBindGroup(0, bgStreak); c.dispatchWorkgroups(Math.ceil(NS / 64)); }
      c.setPipeline(pGlider); c.setBindGroup(0, bgGlider); c.dispatchWorkgroups(1);
      c.end();
    }

    // --- render
    const drawScene = (colorView, depthView) => {
      const r = enc.beginRenderPass({
        colorAttachments: [{ view: colorView, clearValue: { r: 0.05, g: 0.06, b: 0.09, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: {
          view: depthView,
          depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store',
        },
      });
      r.setPipeline(pSky); r.setBindGroup(0, bgSky); r.draw(3);
      r.setPipeline(pApron); r.setBindGroup(0, bgApron); r.draw(4);
      r.setPipeline(pTerrain); r.setBindGroup(0, bgTerrain);
      r.setIndexBuffer(idxB, 'uint32'); r.drawIndexed(idx.length);
      if (box.on) { r.setPipeline(pBox); r.setBindGroup(0, bgBox); r.draw(36); }
      r.setPipeline(pIntent); r.setBindGroup(0, bgIntent); r.draw(256);
      r.setPipeline(pTrail); r.setBindGroup(0, bgTrail); r.draw(TRAIL_N);
      r.setPipeline(pPartR); r.setBindGroup(0, bgPartR); r.draw(4, NP);
      if (pulseActive) { r.setPipeline(pStreakR); r.setBindGroup(0, bgStreakR); r.draw(4, NS); }
      r.setPipeline(pGliderR); r.setBindGroup(0, bgGliderR); r.draw(6);
      r.setPipeline(pGlow); r.setBindGroup(0, bgGlow); r.draw(4);
      r.end();
    };
    drawScene(ctx.getCurrentTexture().createView(), depthTex.createView());

    // record a velocity probe copy (mapped at the top of next frame)
    if (probeReq && !probeInFlight && !probeMapping) {
      const pr = probeReq; probeReq = null;
      const ci = Math.max(0, Math.min(NX - 1, Math.floor(pr.x / DXM)));
      const cj = Math.max(0, Math.min(NY - 1, Math.floor(pr.y / DXM)));
      const ck = Math.max(0, Math.min(NZ - 1, Math.floor(pr.z / DXM)));
      enc.copyBufferToBuffer(vel, (ci + NX * (cj + NY * ck)) * 16, probeRead, 0, 16);
      probeInFlight = pr;
    }

    // offscreen capture for tooling (window.__capture() → dataURL promise)
    if (captureReq) {
      const req = captureReq; captureReq = null;
      const cw = 896, ch = 560;
      const capTex = device.createTexture({ size: [cw, ch], format,
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
      const capDepth = device.createTexture({ size: [cw, ch], format: depthFormat,
        usage: GPUTextureUsage.RENDER_ATTACHMENT });
      const capBuf = device.createBuffer({ size: cw * 4 * ch,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      drawScene(capTex.createView(), capDepth.createView());
      enc.copyTextureToBuffer({ texture: capTex }, { buffer: capBuf, bytesPerRow: cw * 4 }, [cw, ch]);
      device.queue.submit([enc.finish()]);
      capBuf.mapAsync(GPUMapMode.READ).then(() => {
        const bytes = new Uint8Array(capBuf.getMappedRange().slice(0));
        capBuf.unmap(); capTex.destroy(); capDepth.destroy(); capBuf.destroy();
        const c2 = document.createElement('canvas');
        c2.width = cw; c2.height = ch;
        const g = c2.getContext('2d');
        const img = g.createImageData(cw, ch);
        const bgra = format === 'bgra8unorm';
        for (let i = 0; i < cw * ch; i++) {
          img.data[i * 4]     = bytes[i * 4 + (bgra ? 2 : 0)];
          img.data[i * 4 + 1] = bytes[i * 4 + 1];
          img.data[i * 4 + 2] = bytes[i * 4 + (bgra ? 0 : 2)];
          img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        req(c2.toDataURL('image/png'));
      }).catch(e => req('ERROR: ' + e));
      readout.textContent = readoutText(wind);
      return;   // this frame's commands already submitted
    }

    // occasional glider state readback for the HUD
    if (frameN % 20 === 0 && !readingBack) {
      enc.copyBufferToBuffer(gliderB, 0, gliderRead, 0, 32 * 4);
      readingBack = true;
      device.queue.submit([enc.finish()]);
      gliderRead.mapAsync(GPUMapMode.READ).then(() => {
        const g = new Float32Array(gliderRead.getMappedRange().slice(0));
        gliderRead.unmap();
        readingBack = false;
        gliderLabel.textContent = 'glider: ' + (modeNames[Math.round(g[3])] || 'soaring') +
          '  ·  ' + Math.round(g[2] * 3.28) + ' ft';
      }).catch(() => { readingBack = false; });
    } else {
      device.queue.submit([enc.finish()]);
    }

    readout.textContent = readoutText(wind);
  }
  requestAnimationFrame(frame);
}

boot().catch(e => {
  console.error(e);
  $('err').style.display = 'grid';
});
</script>
</body>
</html>
